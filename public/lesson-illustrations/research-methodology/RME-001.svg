<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title>Introduction to Scientific Research</title><desc>Research cycle from question to evidence, analysis and responsible conclusion.</desc><rect width="1200" height="560" rx="28" fill="#f5f8fc"/><text x="600" y="76" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">RME-001 · Scientific Research Cycle</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="65" y="170" width="230" height="190" rx="22" fill="#dcecff" stroke="#3976ad" stroke-width="3"/><text x="180" y="235" font-size="27" font-weight="700" fill="#17324d">Research</text><text x="180" y="273" font-size="24" fill="#17324d">question</text><text x="180" y="320" font-size="18" fill="#36556f">Define the uncertainty</text><rect x="355" y="170" width="230" height="190" rx="22" fill="#e3f4ec" stroke="#36866b" stroke-width="3"/><text x="470" y="235" font-size="27" font-weight="700" fill="#174b3a">Study design</text><text x="470" y="273" font-size="22" fill="#174b3a">Methods & ethics</text><text x="470" y="320" font-size="18" fill="#365f50">Plan valid procedures</text><rect x="645" y="170" width="230" height="190" rx="22" fill="#fff0d8" stroke="#b77a24" stroke-width="3"/><text x="760" y="235" font-size="27" font-weight="700" fill="#684512">Evidence</text><text x="760" y="273" font-size="22" fill="#684512">Collect & analyse</text><text x="760" y="320" font-size="18" fill="#765d39">Measure transparently</text><rect x="935" y="170" width="230" height="190" rx="22" fill="#f0e7fb" stroke="#7951a5" stroke-width="3"/><text x="1050" y="235" font-size="27" font-weight="700" fill="#462b68">Conclusion</text><text x="1050" y="273" font-size="22" fill="#462b68">Interpret & report</text><text x="1050" y="320" font-size="18" fill="#614a7b">State limits honestly</text></g><g stroke="#47647e" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M300 265 H340 M326 250 L342 265 L326 280"/><path d="M590 265 H630 M616 250 L632 265 L616 280"/><path d="M880 265 H920 M906 250 L922 265 L906 280"/></g><text x="600" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" fill="#47647e">Optometry example: estimate refractive-error prevalence using standardised visual-acuity testing and refraction.</text></svg>