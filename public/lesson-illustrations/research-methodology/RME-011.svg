<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img"><title>Qualitative Research Methods</title><desc>Conceptual learning diagram for Qualitative Research Methods in optometry research methodology.</desc><rect width="1200" height="560" rx="28" fill="#f5f8fc"/><text x="600" y="72" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17324d">RME-011 · Qualitative Research Methods</text><rect x="45" y="175" width="235" height="190" rx="22" fill="#dcecff" stroke="#3976ad" stroke-width="3"/><text x="162" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">Question</text><text x="162" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#29465e">uncertainty</text><text x="162" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#47647e">Define precisely</text><rect x="330" y="175" width="235" height="190" rx="22" fill="#e3f4ec" stroke="#36866b" stroke-width="3"/><text x="447" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">Research approach</text><text x="447" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#29465e"></text><text x="447" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#47647e">Choose appropriately</text><rect x="615" y="175" width="235" height="190" rx="22" fill="#fff0d8" stroke="#b77a24" stroke-width="3"/><text x="732" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">Measured evidence</text><text x="732" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#29465e"></text><text x="732" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#47647e">Measure consistently</text><rect x="900" y="175" width="235" height="190" rx="22" fill="#f0e7fb" stroke="#7951a5" stroke-width="3"/><text x="1017" y="235" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17324d">Critical conclusion</text><text x="1017" y="275" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#29465e"></text><text x="1017" y="325" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#47647e">Interpret cautiously</text><path d="M280 270 H318 M302 255 L320 270 L302 285" stroke="#47647e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M565 270 H603 M587 255 L605 270 L587 285" stroke="#47647e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M850 270 H888 M872 255 L890 270 L872 285" stroke="#47647e" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#47647e">OPTOMETRY RESEARCH · Connect the method to a clearly defined clinical or vision-science question</text><text x="600" y="490" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#6b7f91">HAKIM OPTICS ACADEMY · Educational illustration</text></svg>