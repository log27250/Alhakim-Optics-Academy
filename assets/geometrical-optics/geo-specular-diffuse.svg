<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Specular and diffuse reflection</title><desc id="d">Parallel incident rays reflect in one direction from a smooth surface and in multiple directions from a rough surface.</desc><rect width="800" height="420" fill="#fff"/><text x="40" y="45" font-family="Arial" font-size="25" fill="#17324d">Specular vs diffuse reflection</text><text x="190" y="95" font-family="Arial" font-size="22" fill="#17324d">Smooth surface</text><text x="570" y="95" font-family="Arial" font-size="22" fill="#17324d">Rough surface</text><path d="M90 245 H350 M470 245 L500 238 L530 250 L560 239 L590 251 L620 238 L650 250 L690 240 L730 245" stroke="#333" stroke-width="7" fill="none"/><g stroke="#d28a00" stroke-width="5" fill="none"><path d="M130 130 L180 245 L230 130 M190 130 L240 245 L290 130 M250 130 L300 245 L350 130"/><path d="M510 130 L530 245 L560 125 M570 130 L590 245 L630 125 M630 130 L650 245 L700 125"/></g><g stroke="#2678b8" stroke-width="5" fill="none"><path d="M180 245 L180 355 M240 245 L240 355 M300 245 L300 355"/><path d="M530 245 L490 340 M530 245 L550 355 M590 245 L610 345 M650 245 L700 340"/></g><text x="130" y="390" font-family="Arial" font-size="18" fill="#2678b8">One reflected direction</text><text x="520" y="390" font-family="Arial" font-size="18" fill="#2678b8">Many directions</text></svg>