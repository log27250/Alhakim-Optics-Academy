<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Total internal reflection in an optical fibre</title><desc id="d">A ray reflects repeatedly within a higher-index fibre core surrounded by lower-index cladding.</desc><rect width="960" height="420" rx="22" fill="#f7fafc"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Optical fibre: repeated total internal reflection</text><rect x="90" y="125" width="780" height="190" rx="75" fill="#dbeafe" stroke="#64748b" stroke-width="3"/><rect x="90" y="165" width="780" height="110" rx="45" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/><path d="M120 220 L245 175 L370 265 L495 175 L620 265 L745 175 L835 220" fill="none" stroke="#dc6b18" stroke-width="6" stroke-linejoin="round"/><g fill="#17324d" font-family="Arial" font-size="17"><text x="480" y="105" text-anchor="middle">Lower-index cladding</text><text x="480" y="300" text-anchor="middle">Higher-index core</text><text x="480" y="370" text-anchor="middle">Guiding occurs when incidence at the core boundary exceeds the critical angle.</text></g></svg>