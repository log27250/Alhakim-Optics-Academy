<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Concave mirror image formation</title><desc id="d">Schematic principal rays from an object beyond the centre of curvature converge to form a real inverted image between centre and focus.</desc><rect width="960" height="440" rx="22" fill="#f7fafc"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Concave mirror: one object position</text><path d="M820 95 Q900 220 820 345" fill="none" stroke="#0f766e" stroke-width="9"/><path d="M90 250 H850" stroke="#64748b" stroke-width="2"/><path d="M250 250 V115 M238 132 L250 110 L262 132" stroke="#2563eb" stroke-width="4" fill="none"/><path d="M520 250 V315 M508 295 L520 320 L532 295" stroke="#dc2626" stroke-width="4" fill="none"/><g stroke="#f59e0b" stroke-width="3" fill="none"><path d="M250 115 H820 Q680 115 520 315"/><path d="M250 115 L820 345 L520 315"/></g><g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="250" y="90">Object</text><text x="520" y="355">Real inverted image</text><text x="640" y="278">F</text><text x="430" y="278">C</text><text x="840" y="380">Mirror</text></g><text x="480" y="415" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677a">Schematic principal-ray construction; exact positions depend on object distance.</text></svg>