<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Electromagnetic spectrum and visible light</title><desc id="d">A schematic spectrum from radio waves to gamma rays with the visible band enlarged.</desc><rect width="960" height="420" rx="22" fill="#f7fafc"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Electromagnetic spectrum</text><g font-family="Arial" font-size="16" text-anchor="middle" fill="#17324d"><rect x="55" y="105" width="140" height="82" rx="10" fill="#dbeafe"/><rect x="200" y="105" width="140" height="82" rx="10" fill="#bfdbfe"/><rect x="345" y="105" width="140" height="82" rx="10" fill="#c4b5fd"/><rect x="490" y="105" width="140" height="82" rx="10" fill="#86efac"/><rect x="635" y="105" width="140" height="82" rx="10" fill="#fcd34d"/><rect x="780" y="105" width="125" height="82" rx="10" fill="#fca5a5"/><text x="125" y="151">Radio</text><text x="270" y="151">Microwave</text><text x="415" y="151">Infrared</text><text x="560" y="151">Visible</text><text x="705" y="151">Ultraviolet</text><text x="842" y="151">X / gamma</text></g><path d="M490 200 V230 H630 V200" fill="none" stroke="#17324d" stroke-width="3"/><text x="560" y="260" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#17324d">Visible band (approx. 380–700 nm)</text><defs><linearGradient id="v"><stop stop-color="#7c3aed"/><stop offset=".18" stop-color="#2563eb"/><stop offset=".38" stop-color="#06b6d4"/><stop offset=".55" stop-color="#22c55e"/><stop offset=".72" stop-color="#eab308"/><stop offset=".86" stop-color="#f97316"/><stop offset="1" stop-color="#dc2626"/></linearGradient></defs><rect x="155" y="292" width="650" height="38" rx="12" fill="url(#v)"/><text x="155" y="360" font-family="Arial" font-size="16" fill="#17324d">~380 nm</text><text x="805" y="360" text-anchor="end" font-family="Arial" font-size="16" fill="#17324d">~700 nm</text><text x="480" y="395" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677a">Schematic only; boundaries vary by convention and observer.</text></svg>