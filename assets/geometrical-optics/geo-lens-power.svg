<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Lens power and focal length</title><desc id="d">A thin converging lens with focal length labelled and the power formula in dioptres.</desc><rect width="800" height="420" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="25" fill="#17324d">Lens power and focal length</text><path d="M400 95 Q330 210 400 325 Q470 210 400 95 Z" fill="#d9edf7" stroke="#28627f" stroke-width="5"/><path d="M80 210 H720" stroke="#777" stroke-width="2" stroke-dasharray="8 7"/><path d="M120 140 L400 140 L610 210 M120 280 L400 280 L610 210" stroke="#d28a00" stroke-width="4" fill="none"/><circle cx="610" cy="210" r="6" fill="#b23a48"/><text x="620" y="200" font-family="Arial" font-size="20" fill="#17324d">F</text><path d="M400 355 H610 M400 345 V365 M610 345 V365" stroke="#17324d" stroke-width="3"/><text x="470" y="390" font-family="Arial" font-size="20" fill="#17324d">f</text><text x="300" y="90" font-family="Arial" font-size="20" fill="#17324d">Converging lens</text><text x="300" y="415" font-family="Arial" font-size="22" fill="#17324d">P = 1 / f (metres), unit: dioptre (D)</text></svg>