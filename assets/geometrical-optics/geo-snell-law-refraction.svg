<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" role="img" aria-labelledby="t d"><title id="t">Snell's law refraction</title><desc id="d">Incident and refracted rays at a boundary with normal and measured angles.</desc><rect width="960" height="560" rx="24" fill="#f7fbff"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">REFRACTION AND SNELL'S LAW</text><rect x="60" y="90" width="840" height="205" rx="14" fill="#eaf4ff"/><rect x="60" y="295" width="840" height="205" rx="14" fill="#e8f5ef"/><path d="M60 295H900" stroke="#284b63" stroke-width="4"/><path d="M480 95V500" stroke="#6b7280" stroke-width="3" stroke-dasharray="10 9"/><path d="M270 125L480 295L585 470" fill="none" stroke="#e06b35" stroke-width="9" stroke-linecap="round"/><path d="M480 295L585 470" stroke="#e06b35" stroke-width="9"/><path d="M480 295L270 125" stroke="#e06b35" stroke-width="9"/><path d="M480 295L480 120" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 7"/><path d="M480 295L480 470" stroke="#6b7280" stroke-width="2" stroke-dasharray="7 7"/><path d="M480 220 A75 75 0 0 0 425 242" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M480 365 A70 70 0 0 1 515 356" fill="none" stroke="#2563eb" stroke-width="4"/><text x="300" y="155" font-family="Arial" font-size="23" fill="#17324d">Incident ray</text><text x="600" y="435" font-family="Arial" font-size="23" fill="#17324d">Refracted ray</text><text x="505" y="180" font-family="Arial" font-size="21" fill="#2563eb">θ₁</text><text x="530" y="370" font-family="Arial" font-size="21" fill="#2563eb">θ₂</text><text x="80" y="130" font-family="Arial" font-size="23" fill="#17324d">Medium 1 (n₁)</text><text x="80" y="460" font-family="Arial" font-size="23" fill="#17324d">Medium 2 (n₂ &gt; n₁)</text><text x="480" y="535" text-anchor="middle" font-family="Arial" font-size="22" font-weight="700" fill="#17324d">n₁ sin θ₁ = n₂ sin θ₂</text></svg>