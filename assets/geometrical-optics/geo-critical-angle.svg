<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Critical angle</title><desc id="d">Three ray paths at below, equal to, and above the critical angle at a high to low refractive index boundary.</desc><rect width="800" height="440" fill="#fff"/><text x="35" y="42" font-family="Arial" font-size="25" fill="#17324d">Critical angle at a high-to-low index boundary</text><path d="M40 210 H760" stroke="#333" stroke-width="4"/><rect x="40" y="214" width="720" height="190" fill="#e9f3fa"/><text x="55" y="245" font-family="Arial" font-size="19" fill="#17324d">Higher refractive index (n₁)</text><text x="55" y="390" font-family="Arial" font-size="19" fill="#17324d">Lower refractive index (n₂)</text><path d="M250 380 L400 210 L520 105" stroke="#2678b8" stroke-width="5" fill="none"/><path d="M400 210 L590 210" stroke="#d28a00" stroke-width="5" fill="none"/><path d="M400 210 L585 330" stroke="#b23a48" stroke-width="5" fill="none"/><path d="M400 210 V390" stroke="#777" stroke-width="2" stroke-dasharray="7 7"/><text x="530" y="90" font-family="Arial" font-size="18" fill="#2678b8">Below θc: refracts</text><text x="595" y="195" font-family="Arial" font-size="18" fill="#a66b00">At θc: along boundary</text><text x="590" y="355" font-family="Arial" font-size="18" fill="#b23a48">Above θc: total reflection</text></svg>