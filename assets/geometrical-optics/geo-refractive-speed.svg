<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Refractive index and speed</title><desc id="d">Comparison of light speed in vacuum and a transparent medium, illustrating n equals c over v.</desc><rect width="800" height="420" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="25" fill="#17324d">Refractive index and light speed</text><rect x="55" y="105" width="690" height="115" rx="12" fill="#eef6fb" stroke="#6a9ab5" stroke-width="3"/><text x="80" y="145" font-family="Arial" font-size="22" fill="#17324d">Vacuum</text><path d="M100 180 H690" stroke="#d28a00" stroke-width="7"/><path d="M670 165 L695 180 L670 195" stroke="#d28a00" stroke-width="7" fill="none"/><text x="330" y="165" font-family="Arial" font-size="20" fill="#17324d">speed = c</text><rect x="55" y="255" width="690" height="115" rx="12" fill="#f1f5f2" stroke="#6b9b7b" stroke-width="3"/><text x="80" y="295" font-family="Arial" font-size="22" fill="#17324d">Transparent medium</text><path d="M100 330 H390" stroke="#2678b8" stroke-width="7"/><path d="M370 315 L395 330 L370 345" stroke="#2678b8" stroke-width="7" fill="none"/><text x="450" y="337" font-family="Arial" font-size="20" fill="#17324d">speed = v (usually v &lt; c)</text><text x="315" y="405" font-family="Arial" font-size="24" fill="#17324d">n = c / v</text></svg>