<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Wavefronts and light rays</title><desc id="d">Parallel wavefronts with perpendicular rays showing direction of propagation.</desc><rect width="800" height="420" fill="#fff"/><text x="40" y="48" font-family="Arial" font-size="25" fill="#17324d">Wavefronts and light rays</text><g stroke="#2678b8" stroke-width="5" fill="none"><path d="M160 100 V330 M280 100 V330 M400 100 V330 M520 100 V330 M640 100 V330"/></g><g stroke="#d28a00" stroke-width="5" fill="none"><path d="M90 210 H700 M680 190 L705 210 L680 230"/></g><text x="165" y="365" font-family="Arial" font-size="19" fill="#2678b8">Wavefronts</text><text x="520" y="175" font-family="Arial" font-size="19" fill="#a66b00">Ray direction</text><text x="40" y="400" font-family="Arial" font-size="17" fill="#555">In an isotropic medium, rays are perpendicular to wavefronts.</text></svg>