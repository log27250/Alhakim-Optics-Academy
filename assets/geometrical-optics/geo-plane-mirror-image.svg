<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Plane mirror virtual image construction</title><desc id="d">Object and virtual image at equal perpendicular distances from a plane mirror.</desc><rect width="960" height="440" rx="22" fill="#f7fafc"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Plane-mirror image formation</text><path d="M480 90 V365" stroke="#0f766e" stroke-width="8"/><path d="M455 105 H505" stroke="#0f766e" stroke-width="3"/><g stroke="#2563eb" stroke-width="4" fill="none"><path d="M255 310 V150 M245 165 L255 145 L265 165"/><path d="M705 310 V150" stroke-dasharray="9 7"/><path d="M255 150 L480 230 L705 150" stroke="#f59e0b" stroke-width="3"/><path d="M255 150 L480 230" stroke="#f59e0b" stroke-width="3"/><path d="M480 230 L705 150" stroke="#f59e0b" stroke-width="3" stroke-dasharray="7 6"/></g><g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="255" y="120" font-weight="700">Object</text><text x="705" y="120" font-weight="700">Virtual image</text><text x="480" y="390">Plane mirror</text><text x="255" y="345">u</text><text x="705" y="345">v = u</text></g><text x="480" y="420" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677a">Image is upright, virtual and the same size; ray paths behind the mirror are extensions.</text></svg>