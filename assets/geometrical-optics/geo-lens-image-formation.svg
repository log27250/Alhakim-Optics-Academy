<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-labelledby="t d"><title id="t">Converging lens image formation</title><desc id="d">Parallel and central rays pass through a converging thin lens and meet at an image point.</desc><rect width="960" height="440" rx="22" fill="#f7fafc"/><text x="480" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="700" fill="#17324d">Converging thin lens: ray construction</text><path d="M480 95 Q420 220 480 345 Q540 220 480 95" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><path d="M75 220 H885" stroke="#64748b" stroke-width="2"/><path d="M110 145 H480 L760 310 M110 145 L480 220 L760 310 M110 220 H480 L760 220" fill="none" stroke="#dc6b18" stroke-width="4"/><path d="M760 310 L746 287 L770 295" fill="none" stroke="#dc6b18" stroke-width="3"/><circle cx="760" cy="310" r="7" fill="#dc2626"/><g font-family="Arial" font-size="18" fill="#17324d" text-anchor="middle"><text x="480" y="80">Thin lens</text><text x="760" y="350">Image point</text><text x="110" y="120">Object-side rays</text></g><text x="480" y="410" text-anchor="middle" font-family="Arial" font-size="14" fill="#52677a">Schematic paraxial rays; image location depends on object distance and focal length.</text></svg>