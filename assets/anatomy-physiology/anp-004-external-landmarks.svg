<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">External eyelid landmarks</title><desc id="d">Educational diagram of upper and lower eyelid anatomy, tarsal plate, meibomian glands, eyelashes, conjunctiva, canthi and tear film.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f5f9fd"/><stop offset="1" stop-color="#e5eff7"/></linearGradient><linearGradient id="skin" x2="0" y2="1"><stop stop-color="#f4c7ad"/><stop offset="1" stop-color="#d9957d"/></linearGradient></defs><rect width="1200" height="760" rx="28" fill="url(#bg)"/><rect x="28" y="24" width="1144" height="90" rx="18" fill="#123c61"/><text x="58" y="60" fill="#b9d9ec" font-family="Arial" font-size="18" letter-spacing="2">HAKIM OPTICS ACADEMY • ANATOMY &amp; PHYSIOLOGY</text><text x="58" y="94" fill="#fff" font-family="Arial" font-size="30" font-weight="700">External Eyelid Landmarks</text><rect x="34" y="136" width="700" height="584" rx="20" fill="#fff" stroke="#c4d5e2" stroke-width="2"/><text x="62" y="178" fill="#17466f" font-family="Arial" font-size="22" font-weight="700">EXTERNAL LANDMARKS</text><path d="M105 390 Q360 205 650 390 Q360 580 105 390Z" fill="#f4d9c9" stroke="#9b665b" stroke-width="5"/><path d="M110 390 Q360 214 648 390 Q360 310 110 390Z" fill="url(#skin)" stroke="#a96d60" stroke-width="4"/><path d="M110 390 Q360 566 648 390 Q360 478 110 390Z" fill="#e6ad98" stroke="#a96d60" stroke-width="4"/><path d="M118 386 Q360 236 640 386" fill="none" stroke="#344f70" stroke-width="12" stroke-linecap="round"/><path d="M120 397 Q360 540 638 397" fill="none" stroke="#8e5a50" stroke-width="8"/><g stroke="#253f5c" stroke-width="4"><path d="M190 350l-18-28m45 8-12-32m52 10-6-33m55 17v-34m54 30 7-33m47 42 15-29m36 53 22-24m25 33 24-18"/></g><g fill="#e9b64e" stroke="#9a7025" stroke-width="2"><ellipse cx="260" cy="302" rx="7" ry="22"/><ellipse cx="286" cy="290" rx="7" ry="22"/><ellipse cx="312" cy="282" rx="7" ry="22"/><ellipse cx="338" cy="279" rx="7" ry="22"/><ellipse cx="364" cy="281" rx="7" ry="22"/><ellipse cx="390" cy="287" rx="7" ry="22"/><ellipse cx="416" cy="298" rx="7" ry="22"/></g><g font-family="Arial" font-size="17" fill="#18364f"><path d="M490 246L575 210" stroke="#416b8e" stroke-width="2"/><text x="580" y="211">Upper eyelid</text><path d="M500 394L578 420" stroke="#416b8e" stroke-width="2"/><text x="584" y="426">Palpebral fissure</text><path d="M180 390L95 320" stroke="#416b8e" stroke-width="2"/><text x="62" y="305">Medial canthus</text><path d="M610 390L680 350" stroke="#416b8e" stroke-width="2"/><text x="545" y="335">Lateral canthus</text><path d="M340 290L300 230" stroke="#416b8e" stroke-width="2"/><text x="210" y="220">Eyelashes (cilia)</text><path d="M380 480L430 555" stroke="#416b8e" stroke-width="2"/><text x="430" y="575">Lower eyelid</text></g><rect x="758" y="136" width="408" height="584" rx="20" fill="#e8f3f0" stroke="#b8d5cc" stroke-width="2"/><text x="788" y="178" fill="#1d6657" font-family="Arial" font-size="22" font-weight="700">KEY FUNCTIONS</text><g font-family="Arial"><rect x="788" y="205" width="348" height="94" rx="14" fill="#fff"/><text x="810" y="240" font-size="20" font-weight="700" fill="#17466f">Protection</text><text x="810" y="269" font-size="15" fill="#536d7f">Shields the globe from injury and debris.</text><rect x="788" y="320" width="348" height="94" rx="14" fill="#fff"/><text x="810" y="355" font-size="20" font-weight="700" fill="#17466f">Tear distribution</text><text x="810" y="384" font-size="15" fill="#536d7f">Blinking spreads and renews the tear film.</text><rect x="788" y="435" width="348" height="94" rx="14" fill="#fff"/><text x="810" y="470" font-size="20" font-weight="700" fill="#17466f">Meibum delivery</text><text x="810" y="499" font-size="15" fill="#536d7f">Lipid reduces evaporation of tears.</text><rect x="788" y="550" width="348" height="126" rx="14" fill="#fff"/><text x="810" y="585" font-size="20" font-weight="700" fill="#17466f">Clinical relevance</text><text x="810" y="614" font-size="15" fill="#536d7f">Position, blink and lid margin affect</text><text x="810" y="638" font-size="15" fill="#536d7f">corneal health and visual comfort.</text></g></svg>