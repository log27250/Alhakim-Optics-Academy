<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Eyelid glands and tear film contribution</title><desc id="d">Diagram showing meibomian glands in tarsal plate, glands of Zeis and Moll at lash follicles, and accessory lacrimal glands.</desc><rect width="1200" height="700" rx="26" fill="#f4f8fc"/><rect x="28" y="24" width="1144" height="86" rx="18" fill="#123c61"/><text x="58" y="58" fill="#b9d9ec" font-family="Arial" font-size="17">HAKIM OPTICS ACADEMY • GLANDULAR ANATOMY</text><text x="58" y="91" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Eyelid Glands and Their Secretions</text><rect x="55" y="145" width="690" height="500" rx="18" fill="#fff" stroke="#c7d8e5" stroke-width="2"/><path d="M105 255 Q390 185 690 255 L690 355 Q390 300 105 355Z" fill="#e8b6a0" stroke="#9b6b5e" stroke-width="3"/><path d="M105 355 Q390 300 690 355 L690 565 Q390 520 105 565Z" fill="#d5e2eb" stroke="#7794a8" stroke-width="3"/><g fill="#e5b44f" stroke="#9b702a" stroke-width="2"><path d="M220 380q-35 35 0 70q35-35 0-70M285 365q-35 35 0 70q35-35 0-70M350 355q-35 35 0 70q35-35 0-70M415 355q-35 35 0 70q35-35 0-70M480 365q-35 35 0 70q35-35 0-70"/></g><g stroke="#263f5b" stroke-width="5"><path d="M190 245l-22-60m65 52-12-65m72 58 0-65m70 65 12-65m70 72 25-60"/></g><g fill="#d98c72" stroke="#9c5f4f" stroke-width="2"><ellipse cx="190" cy="248" rx="16" ry="10"/><ellipse cx="255" cy="232" rx="16" ry="10"/><ellipse cx="325" cy="225" rx="16" ry="10"/></g><g font-family="Arial" fill="#18364f" font-size="18"><path d="M250 245L620 190" stroke="#426a88" stroke-width="2"/><text x="500" y="178">Zeis / Moll near lash follicles</text><path d="M380 410L625 425" stroke="#426a88" stroke-width="2"/><text x="495" y="455">Meibomian glands</text><text x="85" y="605" font-size="15" fill="#536d7f">Tarsal plate shown as the supporting band.</text></g><rect x="775" y="145" width="370" height="500" rx="18" fill="#e8f3f0" stroke="#b9d5cc" stroke-width="2"/><text x="805" y="190" font-family="Arial" font-size="22" font-weight="700" fill="#1d6657">SECRETIONS</text><g font-family="Arial"><rect x="805" y="215" width="310" height="105" rx="14" fill="#fff"/><text x="825" y="250" font-size="19" font-weight="700" fill="#17466f">Meibomian</text><text x="825" y="279" font-size="15" fill="#536d7f">Meibum (lipid) slows tear</text><text x="825" y="300" font-size="15" fill="#536d7f">evaporation.</text><rect x="805" y="340" width="310" height="105" rx="14" fill="#fff"/><text x="825" y="375" font-size="19" font-weight="700" fill="#17466f">Zeis and Moll</text><text x="825" y="404" font-size="15" fill="#536d7f">Associated with eyelashes;</text><text x="825" y="425" font-size="15" fill="#536d7f">sebaceous / apocrine secretion.</text><rect x="805" y="465" width="310" height="140" rx="14" fill="#fff"/><text x="825" y="500" font-size="19" font-weight="700" fill="#17466f">Krause and Wolfring</text><text x="825" y="529" font-size="15" fill="#536d7f">Accessory lacrimal glands;</text><text x="825" y="550" font-size="15" fill="#536d7f">contribute aqueous secretion</text><text x="825" y="571" font-size="15" fill="#536d7f">to the tear film.</text></g></svg>