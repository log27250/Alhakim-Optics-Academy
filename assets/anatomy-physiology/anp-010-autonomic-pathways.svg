<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Autonomic pathways controlling pupil size</title><desc id="d">Flowchart of parasympathetic pathway to sphincter and sympathetic pathway to dilator muscle.</desc><rect width="1200" height="650" rx="28" fill="#f4f8fc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#173d60">AUTONOMIC CONTROL OF THE PUPIL</text><g font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle"><rect x="70" y="130" width="470" height="75" rx="15" fill="#d9e9f6"/><text x="305" y="177" fill="#23415d">PARASYMPATHETIC PATHWAY</text><rect x="660" y="130" width="470" height="75" rx="15" fill="#f3dfc8"/><text x="895" y="177" fill="#674322">SYMPATHETIC PATHWAY</text><rect x="100" y="260" width="410" height="72" rx="15" fill="#fff"/><text x="305" y="305" fill="#23415d">Edinger–Westphal nucleus</text><rect x="690" y="260" width="410" height="72" rx="15" fill="#fff"/><text x="895" y="305" fill="#674322">Hypothalamus → spinal centre</text><rect x="100" y="370" width="410" height="72" rx="15" fill="#fff"/><text x="305" y="415" fill="#23415d">CN III → ciliary ganglion</text><rect x="690" y="370" width="410" height="72" rx="15" fill="#fff"/><text x="895" y="415" fill="#674322">Superior cervical ganglion</text><rect x="100" y="480" width="410" height="72" rx="15" fill="#d7eadc"/><text x="305" y="525" fill="#234a31">Short ciliary nerves → sphincter</text><rect x="690" y="480" width="410" height="72" rx="15" fill="#f5e5d3"/><text x="895" y="525" fill="#674322">Long ciliary nerves → dilator</text></g><g stroke="#477b9c" stroke-width="7" fill="none"><path d="M305 205v55m-15 -15 15 15 15 -15m0 72v53m-15 -15 15 15 15 -15m0 72v53m-15 -15 15 15 15 -15"/></g><g stroke="#a36d35" stroke-width="7" fill="none"><path d="M895 205v55m-15 -15 15 15 15 -15m0 72v53m-15 -15 15 15 15 -15m0 72v53m-15 -15 15 15 15 -15"/></g><text x="305" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#23415d">Miosis</text><text x="895" y="610" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#674322">Mydriasis</text></svg>