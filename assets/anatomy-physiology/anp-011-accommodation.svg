<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Accommodation mechanism</title><desc id="d">Comparison of distance and near focus showing ciliary muscle, zonular tension and lens shape.</desc><rect width="1200" height="650" rx="28" fill="#f4f8fc"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#173d60">ACCOMMODATION: DISTANCE vs NEAR</text><g transform="translate(55 110)"><rect width="520" height="440" rx="24" fill="#fff" stroke="#d3dce7" stroke-width="3"/><text x="260" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#28618b">DISTANCE</text><ellipse cx="260" cy="240" rx="100" ry="145" fill="#cfe7f2" stroke="#4d87a7" stroke-width="6"/><path d="M130 240L170 240M390 240L350 240" stroke="#b57b43" stroke-width="9"/><path d="M260 95L260 110M260 370L260 385" stroke="#b57b43" stroke-width="9"/><text x="260" y="410" text-anchor="middle" font-family="Arial" font-size="22" fill="#33495f">Ciliary muscle relaxed</text><text x="260" y="438" text-anchor="middle" font-family="Arial" font-size="22" fill="#33495f">Zonular tension increased</text></g><g transform="translate(625 110)"><rect width="520" height="440" rx="24" fill="#fff" stroke="#d3dce7" stroke-width="3"/><text x="260" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#28618b">NEAR</text><ellipse cx="260" cy="240" rx="130" ry="165" fill="#cfe7f2" stroke="#4d87a7" stroke-width="6"/><path d="M130 240L155 240M390 240L365 240" stroke="#b57b43" stroke-width="5"/><path d="M260 75L260 110M260 405L260 370" stroke="#b57b43" stroke-width="5"/><text x="260" y="410" text-anchor="middle" font-family="Arial" font-size="22" fill="#33495f">Ciliary muscle contracted</text><text x="260" y="438" text-anchor="middle" font-family="Arial" font-size="22" fill="#33495f">Zonular tension reduced</text></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="18" fill="#526579">Lens becomes more convex for near focus</text></svg>