<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Visual pathway lesion patterns</title><desc id="d">Schematic comparison of monocular, bitemporal and homonymous visual field loss by lesion location.</desc><rect width="800" height="430" fill="#fff"/><text x="35" y="42" font-family="Arial" font-size="25" fill="#17324d">Visual field patterns: simplified localization</text><g font-family="Arial" font-size="19" fill="#17324d"><text x="120" y="95">Optic nerve</text><text x="360" y="95">Optic chiasm</text><text x="610" y="95">Retro-chiasmal</text></g><g stroke="#17324d" stroke-width="3" fill="#eef4f8"><circle cx="160" cy="210" r="68"/><circle cx="400" cy="210" r="68"/><circle cx="640" cy="210" r="68"/></g><g fill="#d55" opacity=".85"><path d="M160 142 A68 68 0 0 0 160 278 Z"/><path d="M332 142 A68 68 0 0 0 400 210 A68 68 0 0 0 468 142 L468 210 A68 68 0 0 1 332 210 Z"/><path d="M572 142 A68 68 0 0 0 572 278 L640 210 Z M640 142 A68 68 0 0 1 708 210 L640 278 Z"/></g><g font-family="Arial" font-size="17" fill="#333"><text x="90" y="320">Monocular loss</text><text x="330" y="320">Bitemporal loss</text><text x="565" y="320">Homonymous loss</text><text x="40" y="385">Schematic only: actual field defects require formal perimetry and clinical correlation.</text></g></svg>