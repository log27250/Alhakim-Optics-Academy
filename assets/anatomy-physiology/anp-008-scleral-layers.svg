<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Scleral wall layers</title><desc id="d">Cross-sectional schematic of conjunctiva, Tenon capsule, episclera, scleral stroma, lamina fusca and choroid.</desc><rect width="1200" height="650" rx="28" fill="#f4f8fc"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#173d60">SCLERAL WALL — OUTSIDE TO INSIDE</text><g font-family="Arial" font-size="25" font-weight="bold"><rect x="150" y="115" width="900" height="58" rx="12" fill="#f4b7c8"/><text x="600" y="153" text-anchor="middle" fill="#54243a">Bulbar conjunctiva</text><rect x="150" y="181" width="900" height="58" rx="12" fill="#f6d8a7"/><text x="600" y="219" text-anchor="middle" fill="#65451c">Tenon's capsule</text><rect x="150" y="247" width="900" height="82" rx="12" fill="#f5a66d"/><path d="M190 288h820" stroke="#b64b25" stroke-width="6" stroke-dasharray="20 14"/><text x="600" y="280" text-anchor="middle" fill="#552b16">Episclera — vascular connective tissue</text><rect x="150" y="337" width="900" height="145" rx="12" fill="#e6e9ef"/><g stroke="#8c9aab" stroke-width="5" fill="none"><path d="M190 370q80 -35 160 0t160 0t160 0t160 0t160 0"/><path d="M190 410q80 -35 160 0t160 0t160 0t160 0t160 0"/><path d="M190 450q80 -35 160 0t160 0t160 0t160 0t160 0"/></g><text x="600" y="423" text-anchor="middle" fill="#26384b">Scleral stroma — dense irregular collagen</text><rect x="150" y="490" width="900" height="55" rx="12" fill="#92734d"/><text x="600" y="527" text-anchor="middle" fill="#fff">Lamina fusca — pigmented inner zone</text><rect x="150" y="552" width="900" height="55" rx="12" fill="#5b426d"/><text x="600" y="589" text-anchor="middle" fill="#fff">Choroid</text></g><text x="600" y="632" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">Simplified educational schematic — not to scale</text></svg>