<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Upper eyelid sagittal section and anatomical layers</title><desc id="d">Schematic cross-section from anterior skin through orbicularis, orbital septum and levator aponeurosis to tarsal plate and palpebral conjunctiva.</desc><rect width="1200" height="700" rx="26" fill="#f1f6fb"/><rect x="28" y="24" width="1144" height="86" rx="18" fill="#123c61"/><text x="58" y="58" fill="#b9d9ec" font-family="Arial" font-size="17">HAKIM OPTICS ACADEMY • SPECIALIZED ANATOMY</text><text x="58" y="91" fill="#fff" font-family="Arial" font-size="28" font-weight="700">Upper Eyelid — Sagittal Section</text><path d="M100 210 Q360 155 570 245 L570 520 Q350 575 100 510Z" fill="#f1c5ae" stroke="#9f6d5e" stroke-width="3"/><path d="M115 224 Q360 175 555 260 L555 310 Q340 245 115 275Z" fill="#d88e7a"/><path d="M120 280 Q350 245 555 315 L555 390 Q350 320 120 350Z" fill="#bd786d"/><path d="M120 350 Q355 320 555 390 L555 425 Q350 370 120 390Z" fill="#e9c36c"/><path d="M120 390 Q355 370 555 425 L555 475 Q350 440 120 450Z" fill="#6f9cba"/><path d="M120 450 Q355 440 555 475 L555 510 Q350 490 120 510Z" fill="#c5e5db"/><path d="M135 205 Q350 140 570 245" fill="none" stroke="#8e5c50" stroke-width="5"/><g font-family="Arial" font-size="19" fill="#18364f"><path d="M250 225L680 180" stroke="#456b8a" stroke-width="2"/><text x="695" y="185">Skin</text><path d="M300 300L680 250" stroke="#456b8a" stroke-width="2"/><text x="695" y="255">Orbicularis oculi</text><path d="M330 365L680 320" stroke="#456b8a" stroke-width="2"/><text x="695" y="325">Orbital septum</text><path d="M360 400L680 390" stroke="#456b8a" stroke-width="2"/><text x="695" y="395">Levator aponeurosis / retractors</text><path d="M350 455L680 465" stroke="#456b8a" stroke-width="2"/><text x="695" y="470">Tarsal plate</text><path d="M350 490L680 540" stroke="#456b8a" stroke-width="2"/><text x="695" y="545">Palpebral conjunctiva</text></g><g fill="#d9a63e" stroke="#946c24" stroke-width="2"><rect x="420" y="448" width="18" height="24" rx="8"/><rect x="450" y="455" width="18" height="24" rx="8"/><rect x="480" y="462" width="18" height="24" rx="8"/></g><path d="M420 445L670 610" stroke="#946c24" stroke-width="2"/><text x="690" y="615" font-family="Arial" font-size="18" fill="#795b21">Meibomian glands within tarsal plate</text><rect x="70" y="590" width="520" height="65" rx="14" fill="#fff" stroke="#c7d7e4"/><text x="92" y="617" font-family="Arial" font-size="16" fill="#17466f">Schematic only — not to scale.</text><text x="92" y="640" font-family="Arial" font-size="14" fill="#536d7f">Layer relationships vary by upper versus lower lid.</text></svg>