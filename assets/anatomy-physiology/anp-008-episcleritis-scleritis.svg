<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="t d"><title id="t">Episcleritis and scleritis clinical comparison</title><desc id="d">Side by side schematic comparing superficial bright episcleral redness with deep violaceous scleral inflammation.</desc><rect width="1200" height="650" rx="28" fill="#f4f8fc"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#173d60">SUPERFICIAL vs DEEP OCULAR INFLAMMATION</text><g transform="translate(65 110)"><rect width="510" height="440" rx="24" fill="#fff" stroke="#d3dce7" stroke-width="3"/><text x="255" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#a33a38">EPISCLERITIS</text><path d="M90 165Q255 75 420 165Q430 260 255 305Q80 260 90 165Z" fill="#fff" stroke="#b9c7d6" stroke-width="5"/><path d="M90 165Q255 75 420 165" fill="none" stroke="#e34d48" stroke-width="15"/><path d="M120 165q70 -25 125 0t130 0" fill="none" stroke="#f08074" stroke-width="7"/><text x="255" y="355" text-anchor="middle" font-family="Arial" font-size="23" fill="#33495f">Superficial bright-red vessels</text><text x="255" y="395" text-anchor="middle" font-family="Arial" font-size="22" fill="#33495f">Usually mild discomfort</text></g><g transform="translate(625 110)"><rect width="510" height="440" rx="24" fill="#fff" stroke="#d3dce7" stroke-width="3"/><text x="255" y="48" text-anchor="middle" font-family="Arial" font-size="29" font-weight="bold" fill="#59335e">SCLERITIS</text><path d="M90 165Q255 75 420 165Q430 260 255 305Q80 260 90 165Z" fill="#fff" stroke="#b9c7d6" stroke-width="5"/><path d="M90 165Q255 75 420 165" fill="none" stroke="#69416e" stroke-width="22"/><path d="M120 172q70 -30 125 -4t130 0" fill="none" stroke="#8a557e" stroke-width="12"/><text x="255" y="355" text-anchor="middle" font-family="Arial" font-size="23" fill="#33495f">Deep violaceous injection</text><text x="255" y="395" text-anchor="middle" font-family="Arial" font-size="22" font-weight="bold" fill="#8c2935">Severe pain — urgent referral</text></g><text x="600" y="600" text-anchor="middle" font-family="Arial" font-size="18" fill="#526579">Illustrative comparison only; diagnosis requires full clinical assessment</text></svg>