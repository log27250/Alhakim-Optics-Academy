<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" rx="28" fill="#f3f8fb"/><rect width="1000" height="92" rx="28" fill="#102b4e"/><text x="45" y="58" fill="#fff" font-family="Arial" font-size="27" font-weight="700">Decentration and Induced Prism</text><text x="50" y="145" fill="#36536d" font-family="Arial" font-size="19">Decentration from optical centre induces prism according to Prentice's rule</text><g transform="translate(80 195)"><circle cx="250" cy="130" r="95" fill="#e2eef4" stroke="#367e9c" stroke-width="4"/><circle cx="250" cy="130" r="10" fill="#d49a42"/><circle cx="330" cy="130" r="10" fill="#b95d56"/><path d="M250 130L330 130" stroke="#183b59" stroke-width="4" stroke-dasharray="7 6"/><text x="250" y="265" text-anchor="middle" font-size="20" fill="#183b59">Optical centre</text><text x="500" y="90" font-size="21" fill="#183b59">Decentration (cm) × power (D)</text><text x="500" y="145" font-size="21" fill="#183b59">= induced prism (Δ)</text></g><text x="50" y="585" fill="#58758a" font-family="Arial" font-size="15">OD-019-L01 • HAKIM OPTICS ACADEMY • Educational schematic</text></svg>