<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Rigid Gas Permeable Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-008-L01 | Rigid Gas Permeable Contact Lenses</text><path d="M100 200 Q220 155 340 200 Q220 245 100 200" fill="#d6e9f8" stroke="#287cb5" stroke-width="4"/><path d="M115 220 Q220 270 325 220" fill="none" stroke="#26966d" stroke-width="5"/><path d="M360 215 H470" stroke="#287cb5" stroke-width="4"/><rect x="485" y="150" width="250" height="130" rx="14" fill="#e9f8f2"/><text x="610" y="195" text-anchor="middle" class="lab">TEAR LENS</text><text x="610" y="230" text-anchor="middle" class="sm">Optical contribution</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Maintains stable front surface</text><text x="425" y="393" class="sm">• Fills space between lens and cornea</text><text x="75" y="412" class="sm">• Tear lens modifies total optical power</text><text x="425" y="412" class="sm">• Fit, movement and centration are essential</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">RGP LENS</text></svg>