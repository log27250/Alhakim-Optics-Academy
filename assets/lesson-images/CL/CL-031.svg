<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Patient Education and Handling</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-031 | Patient Education and Handling</text><rect x="70" y="155" width="200" height="120" rx="14" fill="#eaf4ff"/><text x="170" y="195" text-anchor="middle" class="lab">WASH</text><text x="170" y="230" text-anchor="middle" class="sm">Clean hands</text><path d="M270 215 H310" stroke="#287cb5" stroke-width="4"/><rect x="310" y="155" width="200" height="120" rx="14" fill="#e9f8f2"/><text x="410" y="195" text-anchor="middle" class="lab">INSERT</text><text x="410" y="230" text-anchor="middle" class="sm">Place lens</text><path d="M510 215 H550" stroke="#287cb5" stroke-width="4"/><rect x="550" y="155" width="200" height="120" rx="14" fill="#fff0dc"/><text x="650" y="195" text-anchor="middle" class="lab">REMOVE</text><text x="650" y="230" text-anchor="middle" class="sm">Safe removal</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">SAFETY / CLINICAL POINTS</text><text x="75" y="393" class="sm">• Wash and dry thoroughly</text><text x="425" y="393" class="sm">• Demonstrate safe placement</text><text x="75" y="412" class="sm">• REMOVE</text><text x="425" y="412" class="sm">• Avoid nail / lens damage</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">SUPERVISED PRACTICE</text></svg>