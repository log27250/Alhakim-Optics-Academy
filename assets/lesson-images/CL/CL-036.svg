<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Microbial Keratitis and Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-036 | Microbial Keratitis and Contact Lenses</text><circle cx="220" cy="215" r="80" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><circle cx="220" cy="215" r="28" fill="#f8e2e2" stroke="#c65a5a" stroke-width="4"/><path d="M220 120 V145 M220 285 V310 M125 215 H150 M290 215 H315" stroke="#c65a5a" stroke-width="4"/><rect x="455" y="155" width="280" height="120" rx="14" fill="#f8e2e2"/><text x="595" y="195" text-anchor="middle" class="lab">URGENT REVIEW</text><text x="595" y="230" text-anchor="middle" class="sm">Stop lens wear</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Pain / photophobia / redness</text><text x="425" y="393" class="sm">• Possible infection</text><text x="75" y="412" class="sm">• STOP LENS WEAR</text><text x="425" y="412" class="sm">• Urgent same-day eye assessment</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">SIGHT-THREATENING</text></svg>