<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Therapeutic Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-041 | Therapeutic Contact Lenses</text><path d="M95 215 Q220 125 345 215 Q220 305 95 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M135 215 Q220 170 305 215" fill="none" stroke="#c65a5a" stroke-width="5"/><path d="M365 215 H465" stroke="#287cb5" stroke-width="4"/><rect x="480" y="155" width="255" height="120" rx="14" fill="#e9f8f2"/><text x="607" y="195" text-anchor="middle" class="lab">BANDAGE LENS</text><text x="607" y="230" text-anchor="middle" class="sm">Surface protection</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Epithelial defect / irritation</text><text x="425" y="393" class="sm">• Protective barrier</text><text x="75" y="412" class="sm">• Reduce lid-related mechanical trauma</text><text x="425" y="412" class="sm">• Does not replace treatment of underlying disease</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">THERAPEUTIC USE</text></svg>