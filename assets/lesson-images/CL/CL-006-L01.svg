<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Hydrogel Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-006-L01 | Hydrogel Contact Lenses</text><path d="M120 160 Q220 115 320 160 L320 250 Q220 295 120 250 Z" fill="#d8efff" stroke="#287cb5" stroke-width="4"/><circle cx="165" cy="190" r="9" fill="#287cb5"/><circle cx="220" cy="225" r="9" fill="#287cb5"/><circle cx="275" cy="185" r="9" fill="#287cb5"/><path d="M365 210 H470" stroke="#287cb5" stroke-width="4"/><rect x="485" y="155" width="250" height="115" rx="14" fill="#e9f8f2"/><text x="610" y="195" text-anchor="middle" class="lab">HYDRATED</text><text x="610" y="230" text-anchor="middle" class="sm">Soft and flexible</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Absorbs and retains water</text><text x="425" y="393" class="sm">• Flexible soft material</text><text x="75" y="412" class="sm">• Water content is not oxygen delivery alone</text><text x="425" y="412" class="sm">• Assess fit, surface and corneal response</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">HYDROGEL</text></svg>