<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Cosmetic and Prosthetic Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-042 | Cosmetic and Prosthetic Contact Lenses</text><circle cx="215" cy="215" r="85" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><circle cx="215" cy="215" r="48" fill="#b98b5b" stroke="#795a3a" stroke-width="3"/><circle cx="215" cy="215" r="22" fill="#17354c"/><path d="M310 215 H440" stroke="#287cb5" stroke-width="4"/><rect x="455" y="155" width="280" height="120" rx="14" fill="#e9f8f2"/><text x="595" y="195" text-anchor="middle" class="lab">IRIS / PUPIL DESIGN</text><text x="595" y="230" text-anchor="middle" class="sm">Appearance / light control</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Alter apparent iris colour</text><text x="425" y="393" class="sm">• Mask iris / corneal defects</text><text x="75" y="412" class="sm">• Pupil aperture must preserve useful vision</text><text x="425" y="412" class="sm">• Clinical fitting and hygiene remain essential</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">COSMETIC / PROSTHETIC</text></svg>