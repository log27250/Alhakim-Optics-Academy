<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Contact Lenses for Presbyopia</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-014-L01 | Contact Lenses for Presbyopia</text><rect x="75" y="155" width="275" height="120" rx="14" fill="#eaf4ff"/><text x="212" y="195" text-anchor="middle" class="lab">MULTIFOCAL</text><text x="212" y="230" text-anchor="middle" class="sm">Both eyes: far + near</text><rect x="470" y="155" width="275" height="120" rx="14" fill="#e9f8f2"/><text x="607" y="195" text-anchor="middle" class="lab">MONOVISION</text><text x="607" y="230" text-anchor="middle" class="sm">One far / one near</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Distance and near zones</text><text x="425" y="393" class="sm">• One eye distance / other near</text><text x="75" y="412" class="sm">• Assess dominance and binocular function</text><text x="425" y="412" class="sm">• Trial and counsel about compromises</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">PRESBYOPIC OPTIONS</text></svg>