<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Soft Lens Fitting</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-022-L01 | Soft Lens Fitting</text><path d="M100 215 Q220 130 340 215 Q220 300 100 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M130 215 Q220 165 310 215" fill="none" stroke="#26966d" stroke-width="5"/><path d="M350 215 H465" stroke="#287cb5" stroke-width="4"/><rect x="480" y="155" width="255" height="120" rx="14" fill="#e9f8f2"/><text x="607" y="195" text-anchor="middle" class="lab">CENTRATION</text><text x="607" y="230" text-anchor="middle" class="sm">Coverage + movement</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY FITTING POINTS</text><text x="75" y="393" class="sm">• Lens centred over cornea</text><text x="425" y="393" class="sm">• Movement with blink</text><text x="75" y="412" class="sm">• MOVEMENT</text><text x="425" y="412" class="sm">• Assess tight / loose fit signs</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">SOFT LENS FIT</text></svg>