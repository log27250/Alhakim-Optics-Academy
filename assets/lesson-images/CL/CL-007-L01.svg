<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Silicone Hydrogel Contact Lenses</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-007-L01 | Silicone Hydrogel Contact Lenses</text><rect x="90" y="155" width="260" height="120" rx="14" fill="#eaf4ff"/><text x="220" y="195" text-anchor="middle" class="lab">SILICONE</text><text x="220" y="230" text-anchor="middle" class="sm">Oxygen transport</text><path d="M350 215 H465" stroke="#287cb5" stroke-width="4"/><rect x="465" y="155" width="260" height="120" rx="14" fill="#e9f8f2"/><text x="595" y="195" text-anchor="middle" class="lab">HYDROPHILIC</text><text x="595" y="230" text-anchor="middle" class="sm">Water / wettability</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• High oxygen permeability</text><text x="425" y="393" class="sm">• Water interaction / wettability</text><text x="75" y="412" class="sm">• High Dk does not guarantee comfort</text><text x="425" y="412" class="sm">• Surface and fit remain important</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">SILICONE HYDROGEL</text></svg>