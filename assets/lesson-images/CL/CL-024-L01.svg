<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Scleral Lens Fitting</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-024-L01 | Scleral Lens Fitting</text><path d="M90 215 Q220 130 350 215 Q220 300 90 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M115 215 Q220 165 325 215" fill="none" stroke="#26966d" stroke-width="6"/><path d="M100 185 Q220 105 340 185" fill="none" stroke="#d49a42" stroke-width="4"/><text x="220" y="330" text-anchor="middle" class="lab">Vault + haptic alignment</text><rect x="465" y="155" width="270" height="120" rx="14" fill="#e9f8f2"/><text x="600" y="195" text-anchor="middle" class="lab">SETTLED CLEARANCE</text><text x="600" y="230" text-anchor="middle" class="sm">Reassess after settling</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY FITTING POINTS</text><text x="75" y="393" class="sm">• Avoid corneal touch</text><text x="425" y="393" class="sm">• Protect limbus</text><text x="75" y="412" class="sm">• HAPTIC</text><text x="425" y="412" class="sm">• Aligns with scleral landing zone</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">SCLERAL FITTING</text></svg>