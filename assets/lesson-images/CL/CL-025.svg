<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Toric Lens Fitting and Stabilization</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">CL-025 | Toric Lens Fitting and Stabilization</text><circle cx="215" cy="215" r="82" fill="#fff" stroke="#287cb5" stroke-width="3"/><path d="M133 215 H297 M215 133 V297" stroke="#287cb5" stroke-width="5"/><path d="M215 133 L240 155 L215 177" fill="none" stroke="#26966d" stroke-width="4"/><rect x="455" y="155" width="275" height="120" rx="14" fill="#e9f8f2"/><text x="592" y="195" text-anchor="middle" class="lab">STABILIZE</text><text x="592" y="230" text-anchor="middle" class="sm">Maintain axis</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">SAFETY / CLINICAL POINTS</text><text x="75" y="393" class="sm">• Sphere / cylinder / axis</text><text x="425" y="393" class="sm">• Observe orientation on eye</text><text x="75" y="412" class="sm">• Stabilization keeps cylinder axis aligned</text><text x="425" y="412" class="sm">• Assess fit before applying rotation compensation</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">TORIC STABILITY</text></svg>