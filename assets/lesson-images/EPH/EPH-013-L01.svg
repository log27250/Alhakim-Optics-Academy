<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620"><rect width="1000" height="620" rx="28" fill="#f3f8fb"/><rect width="1000" height="92" rx="28" fill="#102b4e"/><text x="45" y="58" fill="#fff" font-family="Arial" font-size="29" font-weight="700">Scleritis and Episcleritis</text><text x="50" y="145" fill="#36536d" font-family="Arial" font-size="19">Superficial episcleral versus deep scleral inflammation</text><g transform="translate(80 195)"><path d="M40 130Q240 15 440 130Q240 245 40 130Z" fill="#fff" stroke="#367e9c" stroke-width="4"/><path d="M40 130Q240 15 440 130" stroke="#d66a62" stroke-width="15" fill="none"/><path d="M40 145Q240 30 440 145" stroke="#d49a42" stroke-width="8" fill="none"/><g font-size="21" fill="#183b59"><text x="520" y="75">Episcleritis: superficial</text><text x="520" y="130">Scleritis: deep, severe pain</text><text x="520" y="185">Deep pain / reduced vision = urgent</text></g></g><rect x="110" y="475" width="780" height="62" rx="15" fill="#e1edf3"/><text x="500" y="514" text-anchor="middle" font-size="19" fill="#183b59">Pain severity and depth of injection help distinguish conditions</text><text x="50" y="585" fill="#58758a" font-family="Arial" font-size="15">EPH-013-L01 • HAKIM OPTICS ACADEMY • Educational schematic</text></svg>