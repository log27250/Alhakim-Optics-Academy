<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="650" viewBox="0 0 1050 650"><title>Trichromatic Theory of Color Vision</title><rect width="1050" height="650" rx="28" fill="#eff7f3"/><rect x="35" y="30" width="980" height="112" rx="20" fill="#14532d"/><text x="525" y="82" text-anchor="middle" fill="white" font-size="28" font-weight="700">TRICHROMATIC THEORY</text><text x="525" y="116" text-anchor="middle" fill="#d1fae5" font-size="17">VIS-018-L01 • VISUAL SCIENCE</text><rect x="65" y="190" width="300" height="112" rx="18" fill="#f1f8f5" stroke="#14532d" stroke-width="3"/><circle cx="90" cy="217" r="14" fill="#14532d"/><text x="90" y="223" text-anchor="middle" fill="white" font-size="16">1</text><text x="220" y="254" text-anchor="middle" fill="#173b32" font-size="18" font-weight="600">Short-wave S cones</text><rect x="415" y="190" width="300" height="112" rx="18" fill="#f1f8f5" stroke="#0e7490" stroke-width="3"/><circle cx="440" cy="217" r="14" fill="#0e7490"/><text x="440" y="223" text-anchor="middle" fill="white" font-size="16">2</text><text x="570" y="254" text-anchor="middle" fill="#173b32" font-size="18" font-weight="600">Medium-wave M cones</text><rect x="765" y="190" width="300" height="112" rx="18" fill="#f1f8f5" stroke="#7c3aed" stroke-width="3"/><circle cx="790" cy="217" r="14" fill="#7c3aed"/><text x="790" y="223" text-anchor="middle" fill="white" font-size="16">3</text><text x="920" y="254" text-anchor="middle" fill="#173b32" font-size="18" font-weight="600">Long-wave L cones</text><rect x="65" y="365" width="300" height="112" rx="18" fill="#f1f8f5" stroke="#d97706" stroke-width="3"/><circle cx="90" cy="392" r="14" fill="#d97706"/><text x="90" y="398" text-anchor="middle" fill="white" font-size="16">4</text><text x="220" y="429" text-anchor="middle" fill="#173b32" font-size="18" font-weight="600">Combined cone response</text><rect x="415" y="365" width="300" height="112" rx="18" fill="#f1f8f5" stroke="#14532d" stroke-width="3"/><circle cx="440" cy="392" r="14" fill="#14532d"/><text x="440" y="398" text-anchor="middle" fill="white" font-size="16">5</text><text x="570" y="429" text-anchor="middle" fill="#173b32" font-size="18" font-weight="600">Three cone classes encode a wide colour range</text><rect x="65" y="565" width="920" height="52" rx="12" fill="#d9eee3"/><text x="525" y="598" text-anchor="middle" font-size="16" fill="#214d3b">Educational schematic • visual perception and clinical assessment</text></svg>