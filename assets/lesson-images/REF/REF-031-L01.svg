<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Refraction After Ocular Surgery</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-031-L01 | Refraction After Ocular Surgery</text><rect x="70" y="150" width="185" height="130" rx="12" fill="#eaf4ff"/><text x="162" y="195" text-anchor="middle" class="lab">SURGERY</text><text x="162" y="230" text-anchor="middle" class="sm">Procedure</text><path d="M255 215 H315" stroke="#287cb5" stroke-width="4"/><rect x="315" y="150" width="185" height="130" rx="12" fill="#fff0dc"/><text x="407" y="195" text-anchor="middle" class="lab">HEALING</text><text x="407" y="230" text-anchor="middle" class="sm">Stability</text><path d="M500 215 H560" stroke="#287cb5" stroke-width="4"/><rect x="560" y="150" width="185" height="130" rx="12" fill="#e9f8f2"/><text x="652" y="195" text-anchor="middle" class="lab">REFRACTION</text><text x="652" y="230" text-anchor="middle" class="sm">When appropriate</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Cornea / lens / retina</text><text x="425" y="393" class="sm">• Timing depends on procedure</text><text x="75" y="412" class="sm">• Review operation and complications</text><text x="425" y="412" class="sm">• Coordinate with surgeon when needed</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">POSTOPERATIVE REFRACTION</text></svg>