<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Astigmatism Refinement — Clinical Refraction</title><desc id="desc">Educational schematic for Astigmatism Refinement.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#287cb5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17354c}.head{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.foot{font-size:15px;font-weight:700;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="head" fill="#fff" style="fill:#fff">REF-014-L01 | Astigmatism Refinement</text><circle cx="210" cy="215" r="78" fill="#f7fbff" stroke="#287cb5" stroke-width="3"/><path d="M132 215 H288" stroke="#287cb5" stroke-width="5"/><path d="M210 137 V293" stroke="#26966d" stroke-width="5"/><text x="210" y="115" class="small" text-anchor="middle">Principal meridians</text><path d="M320 215 H420" stroke="#287cb5" stroke-width="4" marker-end="url(#arr)"/><rect x="440" y="150" width="300" height="130" rx="14" fill="#eaf4ff"/><text x="590" y="190" class="label" text-anchor="middle">AXIS → POWER</text><text x="590" y="225" class="small" text-anchor="middle">JCC comparisons</text><text x="590" y="250" class="small" text-anchor="middle">Verify visual acuity</text><rect x="50" y="315" width="720" height="105" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="345" class="label">CLINICAL POINTS</text><text x="75" y="375" class="small">• Confirm cylinder notation</text><text x="425" y="375" class="small">• Refine axis with JCC</text><text x="75" y="397" class="small">• Refine cylinder power</text><text x="425" y="397" class="small">• Recheck acuity</text><text x="75" y="419" class="small">• Investigate inconsistent findings</text><text x="425" y="419" class="small">• CYLINDER ENDPOINT</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="foot">CLINICAL REFRACTION</text></svg>