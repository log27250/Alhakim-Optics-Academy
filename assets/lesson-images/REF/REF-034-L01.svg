<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Prism and Refraction Considerations</title><desc id="d">Clinical teaching diagram: Prism and Refraction Considerations</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-034-L01 | Prism and Refraction Considerations</text><path d="M120 160 L270 160 L195 270 Z" fill="#d9edfb" stroke="#287cb5" stroke-width="4"/><path d="M195 120 V160" stroke="#287cb5" stroke-width="3"/><text x="195" y="105" text-anchor="middle" class="lab">APEX</text><path d="M470 210 H680" stroke="#26966d" stroke-width="5"/><path d="M650 195 L680 210 L650 225" fill="none" stroke="#26966d" stroke-width="4"/><text x="570" y="180" text-anchor="middle" class="lab">BASE</text><text x="570" y="250" text-anchor="middle" class="sm">Light deviation</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Object appears displaced toward apex</text><text x="425" y="393" class="sm">• Light deviates toward base</text><text x="75" y="412" class="sm">• Prentice: Δ = c(cm) × F(D)</text><text x="425" y="412" class="sm">• Check optical centre and base direction</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">PRISM / CENTRATION</text></svg>