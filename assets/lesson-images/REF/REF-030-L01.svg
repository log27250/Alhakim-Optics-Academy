<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Refraction in Low Vision Patients</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-030-L01 | Refraction in Low Vision Patients</text><circle cx="205" cy="215" r="78" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><text x="205" y="210" text-anchor="middle" class="lab">VISION</text><text x="205" y="240" text-anchor="middle" class="sm">Function</text><path d="M285 215 H420" stroke="#287cb5" stroke-width="4"/><rect x="435" y="155" width="300" height="120" rx="14" fill="#e9f8f2"/><text x="585" y="195" text-anchor="middle" class="lab">REHABILITATION</text><text x="585" y="230" text-anchor="middle" class="sm">Magnifiers / task aids</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Find achievable acuity</text><text x="425" y="393" class="sm">• Reading / mobility / faces</text><text x="75" y="412" class="sm">• Refraction is one part of rehabilitation</text><text x="425" y="412" class="sm">• Consider magnification and low-vision aids</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">FUNCTION FIRST</text></svg>