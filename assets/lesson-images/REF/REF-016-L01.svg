<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Duochrome Test — Clinical Refraction</title><desc id="desc">Educational schematic for Duochrome Test.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#287cb5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17354c}.head{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.foot{font-size:15px;font-weight:700;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="head" fill="#fff" style="fill:#fff">REF-016-L01 | Duochrome Test</text><rect x="95" y="155" width="285" height="120" rx="12" fill="#fce8e8" stroke="#c94b4b" stroke-width="3"/><text x="237" y="205" class="label" text-anchor="middle">RED</text><text x="237" y="238" class="small" text-anchor="middle">Longer wavelength</text><rect x="425" y="155" width="285" height="120" rx="12" fill="#e5f5e8" stroke="#29965c" stroke-width="3"/><text x="567" y="205" class="label" text-anchor="middle">GREEN</text><text x="567" y="238" class="small" text-anchor="middle">Shorter wavelength</text><path d="M380 215 H425" stroke="#555" stroke-width="3"/><rect x="50" y="315" width="720" height="105" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="345" class="label">CLINICAL POINTS</text><text x="75" y="375" class="small">• Longer wavelength</text><text x="425" y="375" class="small">• GREEN FILTER</text><text x="75" y="397" class="small">• Shorter wavelength</text><text x="425" y="397" class="small">• Green focuses anterior to red</text><text x="75" y="419" class="small">• Near endpoint: similar clarity</text><text x="425" y="419" class="small">• SPHERICAL CHECK</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="foot">CLINICAL REFRACTION</text></svg>