<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Refraction in Corneal Disorders</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-041-L01 | Refraction in Corneal Disorders</text><path d="M100 215 Q220 110 340 215 Q220 320 100 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M145 215 Q220 160 295 215 Q220 270 145 215" fill="#fff" stroke="#26966d" stroke-width="3"/><path d="M400 215 Q520 115 640 215 Q520 315 400 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M430 185 L470 225 L505 180 L545 235 L590 190" fill="none" stroke="#c65a5a" stroke-width="5"/><text x="220" y="330" text-anchor="middle" class="lab">Regular surface</text><text x="520" y="330" text-anchor="middle" class="lab">Irregular surface</text><rect x="50" y="345" width="720" height="72" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="372" class="lab">CLINICAL POINTS</text><text x="75" y="398" class="sm">• Regular / irregular curvature</text><text x="425" y="398" class="sm">• Edema or scar scatters light</text><text x="75" y="415" class="sm">• Keratoconus can cause changing irregular astigmatism</text><text x="425" y="415" class="sm">• Topography / tomography when indicated</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CORNEAL CONTRIBUTION</text></svg>