<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Binocular Balance in Refraction — Clinical Refraction</title><desc id="desc">Educational schematic for Binocular Balance in Refraction.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#287cb5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17354c}.head{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.foot{font-size:15px;font-weight:700;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="head" fill="#fff" style="fill:#fff">REF-015-L01 | Binocular Balance in Refraction</text><rect x="70" y="160" width="250" height="110" rx="14" fill="#eaf4ff" stroke="#287cb5" stroke-width="3"/><text x="195" y="200" class="label" text-anchor="middle">RIGHT EYE</text><text x="195" y="232" class="small" text-anchor="middle">Separate image</text><rect x="480" y="160" width="250" height="110" rx="14" fill="#e9f8f2" stroke="#26966d" stroke-width="3"/><text x="605" y="200" class="label" text-anchor="middle">LEFT EYE</text><text x="605" y="232" class="small" text-anchor="middle">Separate image</text><path d="M320 215 H480" stroke="#555" stroke-width="3" stroke-dasharray="8 7"/><text x="400" y="190" class="small" text-anchor="middle">Dissociation</text><rect x="50" y="315" width="720" height="105" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="345" class="label">CLINICAL POINTS</text><text x="75" y="375" class="small">• DISSOCIATED TARGET</text><text x="425" y="375" class="small">• LEFT EYE</text><text x="75" y="397" class="small">• Compare clarity</text><text x="425" y="397" class="small">• Equalize accommodative stimulus</text><text x="75" y="419" class="small">• Only if both eyes see reliably</text><text x="425" y="419" class="small">• BINOCULAR COMFORT</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="foot">CLINICAL REFRACTION</text></svg>