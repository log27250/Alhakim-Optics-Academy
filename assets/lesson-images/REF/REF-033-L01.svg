<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Refraction in Irregular Astigmatism</title><desc id="d">Clinical teaching diagram: Refraction in Irregular Astigmatism</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-033-L01 | Refraction in Irregular Astigmatism</text><circle cx="215" cy="210" r="78" fill="#fff" stroke="#287cb5" stroke-width="3"/><path d="M137 210 H293 M215 132 V288" stroke="#287cb5" stroke-width="5"/><circle cx="590" cy="210" r="78" fill="#fff" stroke="#26966d" stroke-width="3"/><path d="M520 175 Q570 220 650 160 M515 240 Q590 180 665 250" fill="none" stroke="#26966d" stroke-width="5"/><text x="215" y="315" text-anchor="middle" class="lab">Regular</text><text x="590" y="315" text-anchor="middle" class="lab">Irregular</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Two stable principal meridians</text><text x="425" y="393" class="sm">• Variable local curvature</text><text x="75" y="412" class="sm">• Spectacle cylinder may not remove ghosting</text><text x="425" y="412" class="sm">• Corneal topography helps characterize shape</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">IRREGULAR SURFACE</text></svg>