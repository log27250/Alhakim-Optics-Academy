<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="title desc"><title id="title">Jackson Cross Cylinder — Clinical Refraction</title><desc id="desc">Educational schematic for Jackson Cross Cylinder.</desc><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#287cb5"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17354c}.head{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px}.foot{font-size:15px;font-weight:700;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="head" fill="#fff" style="fill:#fff">REF-013-L01 | Jackson Cross Cylinder</text><circle cx="245" cy="215" r="80" fill="#fff" stroke="#287cb5" stroke-width="3"/><path d="M165 215 H325 M245 135 V295" stroke="#287cb5" stroke-width="5"/><text x="245" y="120" class="small" text-anchor="middle">JCC principal meridians</text><path d="M390 215 H490" stroke="#287cb5" stroke-width="4" marker-end="url(#arr)"/><rect x="510" y="150" width="245" height="55" rx="12" fill="#eaf4ff"/><text x="632" y="185" class="label" text-anchor="middle">FLIP A ↔ B</text><rect x="510" y="225" width="245" height="55" rx="12" fill="#e9f8f2"/><text x="632" y="260" class="label" text-anchor="middle">COMPARE</text><rect x="50" y="315" width="720" height="105" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="345" class="label">CLINICAL POINTS</text><text x="75" y="375" class="small">• Two equal opposite cylinders</text><text x="425" y="375" class="small">• Flip: compare position A / B</text><text x="75" y="397" class="small">• Axis refinement: rotate handle</text><text x="425" y="397" class="small">• Power refinement: compare flips</text><text x="75" y="419" class="small">• Use consistent patient responses</text><text x="425" y="419" class="small">• AXIS + POWER</text>