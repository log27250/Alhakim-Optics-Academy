<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Common Refraction Errors</title><desc id="d">Clinical teaching diagram: Common Refraction Errors</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-038-L01 | Common Refraction Errors</text><rect x="70" y="150" width="205" height="125" rx="14" fill="#eaf4ff"/><text x="172" y="195" text-anchor="middle" class="lab">PATIENT</text><text x="172" y="230" text-anchor="middle" class="sm">Response</text><rect x="305" y="150" width="205" height="125" rx="14" fill="#fff0dc"/><text x="407" y="195" text-anchor="middle" class="lab">INSTRUMENT</text><text x="407" y="230" text-anchor="middle" class="sm">Calibration</text><rect x="540" y="150" width="205" height="125" rx="14" fill="#e9f8f2"/><text x="642" y="195" text-anchor="middle" class="lab">EXAMINER</text><text x="642" y="230" text-anchor="middle" class="sm">Technique</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Poor fixation / inconsistent answers</text><text x="425" y="393" class="sm">• Calibration / alignment</text><text x="75" y="412" class="sm">• EXAMINER</text><text x="425" y="412" class="sm">• Leading prompts / over-minusing</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">QUALITY CONTROL</text></svg>