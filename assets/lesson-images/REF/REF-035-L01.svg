<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Vertex Distance and Lens Power</title><desc id="d">Clinical teaching diagram: Vertex Distance and Lens Power</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-035-L01 | Vertex Distance and Lens Power</text><rect x="100" y="155" width="115" height="120" rx="12" fill="#d9edfb" stroke="#287cb5" stroke-width="3"/><text x="157" y="215" text-anchor="middle" class="lab">Lens</text><path d="M215 215 H450" stroke="#287cb5" stroke-width="3" stroke-dasharray="8 7"/><path d="M450 145 Q490 215 450 285" fill="none" stroke="#26966d" stroke-width="6"/><text x="490" y="120" class="lab">Corneal plane</text><path d="M220 300 V320 M450 300 V320 M220 310 H450" stroke="#123e5c" stroke-width="2"/><text x="335" y="345" text-anchor="middle" class="sm">Vertex distance</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Back vertex distance</text><text x="425" y="393" class="sm">• Effective power changes with separation</text><text x="75" y="412" class="sm">• High powers are most affected</text><text x="425" y="412" class="sm">• Record distance in millimetres</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">VERTEX COMPENSATION</text></svg>