<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img"><title>Refraction of Myopia</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-017-L01 | Refraction of Myopia</text><circle cx="175" cy="215" r="58" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M115 215 H235" stroke="#287cb5" stroke-width="3"/><path d="M235 215 L365 180 M235 215 L365 250" stroke="#287cb5" stroke-width="3"/><path d="M390 150 Q430 215 390 280" fill="none" stroke="#26966d" stroke-width="5"/><path d="M460 215 H575" stroke="#287cb5" stroke-width="4"/><rect x="590" y="160" width="150" height="110" rx="14" fill="#e9f8f2"/><text x="665" y="200" class="lab" text-anchor="middle">MINUS</text><text x="665" y="230" class="sm" text-anchor="middle">Lens</text><text x="410" y="125" class="sm" text-anchor="middle">Eye / focal plane</text><rect x="50" y="315" width="720" height="105" rx="14" fill="white" stroke="#d4e1eb"/><text x="75" y="345" class="lab">CLINICAL POINTS</text><text x="75" y="375" class="sm">• Focus in front of retina</text><text x="425" y="375" class="sm">• Minus lens diverges rays</text><text x="75" y="397" class="sm">• Moves focus onto retina</text><text x="425" y="397" class="sm">• Check axial length and ocular health</text><text x="75" y="419" class="sm">• Avoid unnecessary minus</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">MYOPIC CORRECTION</text></svg>