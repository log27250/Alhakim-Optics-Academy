<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Refraction in Patients with Cataract</title><desc id="d">Clinical teaching diagram: Refraction in Patients with Cataract</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-040-L01 | Refraction in Patients with Cataract</text><path d="M130 215 Q210 130 290 215 Q210 300 130 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M155 215 Q210 170 265 215 Q210 260 155 215" fill="#fff0dc" stroke="#d49a42" stroke-width="3"/><path d="M320 215 H445" stroke="#287cb5" stroke-width="4"/><rect x="460" y="150" width="260" height="130" rx="14" fill="#e9f8f2"/><text x="590" y="195" text-anchor="middle" class="lab">REFRACTION</text><text x="590" y="230" text-anchor="middle" class="sm">Corrects refractive error</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Scattering and reduced contrast</text><text x="425" y="393" class="sm">• Corrects refractive component only</text><text x="75" y="412" class="sm">• Glare may persist despite best correction</text><text x="425" y="412" class="sm">• Assess ocular health and functional impact</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CATARACT LIMITATIONS</text></svg>