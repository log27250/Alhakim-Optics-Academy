<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Prescription Interpretation</title><desc id="d">Clinical teaching diagram: Prescription Interpretation</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-037-L01 | Prescription Interpretation</text><rect x="80" y="145" width="155" height="135" rx="12" fill="#eaf4ff"/><text x="157" y="190" text-anchor="middle" class="lab">SPH</text><text x="157" y="225" text-anchor="middle" class="sm">Power</text><rect x="260" y="145" width="155" height="135" rx="12" fill="#e9f8f2"/><text x="337" y="190" text-anchor="middle" class="lab">CYL / AXIS</text><text x="337" y="225" text-anchor="middle" class="sm">Astigmatism</text><rect x="440" y="145" width="155" height="135" rx="12" fill="#fff0dc"/><text x="517" y="190" text-anchor="middle" class="lab">ADD</text><text x="517" y="225" text-anchor="middle" class="sm">Near plus</text><rect x="620" y="145" width="130" height="135" rx="12" fill="#f2eaff"/><text x="685" y="190" text-anchor="middle" class="lab">PRISM</text><text x="685" y="225" text-anchor="middle" class="sm">Base</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Spherical power (D)</text><text x="425" y="393" class="sm">• Astigmatic power + orientation</text><text x="75" y="412" class="sm">• ADD: near extra plus</text><text x="425" y="412" class="sm">• Prism includes base direction</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">READ EVERY COMPONENT</text></svg>