<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img"><title>Amplitude of Accommodation Testing</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-024-L01 | Amplitude of Accommodation Testing</text><rect x="95" y="155" width="260" height="120" rx="14" fill="#eaf4ff"/><text x="225" y="195" class="lab" text-anchor="middle">NEAR TARGET</text><text x="225" y="230" class="sm" text-anchor="middle">Move gradually closer</text><path d="M360 215 H455" stroke="#287cb5" stroke-width="4"/><rect x="465" y="155" width="260" height="120" rx="14" fill="#e9f8f2"/><text x="595" y="195" class="lab" text-anchor="middle">BLUR POINT</text><text x="595" y="230" class="sm" text-anchor="middle">Measure distance</text><rect x="50" y="315" width="720" height="105" rx="14" fill="white" stroke="#d4e1eb"/><text x="75" y="345" class="lab">CLINICAL POINTS</text><text x="75" y="375" class="sm">• Move target closer</text><text x="425" y="375" class="sm">• First sustained blur</text><text x="75" y="397" class="sm">• AA = 1 / distance (m)</text><text x="425" y="397" class="sm">• 10 cm → 10.00 D</text><text x="75" y="419" class="sm">• Compare methods and age norms</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">ACCOMMODATIVE AMPLITUDE</text></svg>