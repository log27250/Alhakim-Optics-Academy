<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Accommodative Lag Assessment</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-026-L01 | Accommodative Lag Assessment</text><rect x="75" y="155" width="285" height="120" rx="14" fill="#eaf4ff"/><text x="217" y="195" text-anchor="middle" class="lab">STIMULUS</text><text x="217" y="230" text-anchor="middle" class="sm">2.50 D</text><rect x="460" y="155" width="285" height="120" rx="14" fill="#e9f8f2"/><text x="602" y="195" text-anchor="middle" class="lab">RESPONSE</text><text x="602" y="230" text-anchor="middle" class="sm">2.00 D</text><path d="M360 215 H460" stroke="#287cb5" stroke-width="4"/><text x="410" y="190" text-anchor="middle" class="sm">0.50 D lag</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• Near demand (e.g. 2.50 D)</text><text x="425" y="393" class="sm">• Actual accommodative response</text><text x="75" y="412" class="sm">• Lag = stimulus − response</text><text x="425" y="412" class="sm">• Example: 2.50 − 2.00 = 0.50 D</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">LAG MEASUREMENT</text></svg>