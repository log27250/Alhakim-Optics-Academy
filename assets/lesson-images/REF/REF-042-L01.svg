<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Refraction in Retinal Disorders</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-042-L01 | Refraction in Retinal Disorders</text><rect x="85" y="160" width="260" height="115" rx="14" fill="#eaf4ff"/><text x="215" y="200" text-anchor="middle" class="lab">OPTICAL ERROR</text><text x="215" y="235" text-anchor="middle" class="sm">Defocus</text><path d="M350 215 H465" stroke="#287cb5" stroke-width="4"/><rect x="480" y="160" width="260" height="115" rx="14" fill="#fff0dc"/><text x="610" y="200" text-anchor="middle" class="lab">RETINAL LIMIT</text><text x="610" y="235" text-anchor="middle" class="sm">Neural / macular</text><rect x="50" y="345" width="720" height="72" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="372" class="lab">CLINICAL POINTS</text><text x="75" y="398" class="sm">• Image not focused on retina</text><text x="425" y="398" class="sm">• Photoreceptor / macular dysfunction</text><text x="75" y="415" class="sm">• Best-corrected acuity may remain reduced</text><text x="425" y="415" class="sm">• Urgent flashes, floaters or curtain need prompt assessment</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">RETINA LIMITS VISION</text></svg>