<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img"><title>Mixed and Compound Astigmatism</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-020-L01 | Mixed and Compound Astigmatism</text><circle cx="215" cy="215" r="82" fill="#fff" stroke="#287cb5" stroke-width="3"/><path d="M133 215 H297 M215 133 V297" stroke="#287cb5" stroke-width="5"/><path d="M340 160 L440 215 L340 270" fill="none" stroke="#26966d" stroke-width="4"/><rect x="470" y="150" width="270" height="130" rx="14" fill="#eaf4ff"/><text x="605" y="190" class="lab" text-anchor="middle">FOCAL LINES</text><text x="605" y="225" class="sm" text-anchor="middle">TWO PRINCIPAL MERIDIANS</text><text x="605" y="250" class="sm" text-anchor="middle">Classify each meridian</text><rect x="50" y="315" width="720" height="105" rx="14" fill="white" stroke="#d4e1eb"/><text x="75" y="345" class="lab">CLINICAL POINTS</text><text x="75" y="375" class="sm">• Both in front: compound myopic</text><text x="425" y="375" class="sm">• Both behind: compound hyperopic</text><text x="75" y="397" class="sm">• One front + one behind: mixed</text><text x="425" y="397" class="sm">• Classify focal line positions</text><text x="75" y="419" class="sm">• Use sphero-cylinder notation</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">FOCAL LINE CLASSIFICATION</text></svg>