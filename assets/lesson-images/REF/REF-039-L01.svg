<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Difficult Refraction Cases</title><desc id="d">Clinical teaching diagram: Difficult Refraction Cases</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-039-L01 | Difficult Refraction Cases</text><rect x="55" y="165" width="165" height="100" rx="12" fill="#eaf4ff"/><text x="137" y="205" text-anchor="middle" class="lab">RECHECK</text><text x="137" y="235" text-anchor="middle" class="sm">Conditions</text><path d="M220 215 H285 M285 215 V160 H340 M285 215 V270 H340" fill="none" stroke="#287cb5" stroke-width="3"/><rect x="340" y="125" width="190" height="75" rx="12" fill="#e9f8f2"/><text x="435" y="170" text-anchor="middle" class="lab">OBJECTIVE TEST</text><rect x="340" y="230" width="190" height="75" rx="12" fill="#fff0dc"/><text x="435" y="275" text-anchor="middle" class="lab">OCULAR HEALTH</text><path d="M530 160 H600 V215 H660 M530 270 H600 V215" fill="none" stroke="#26966d" stroke-width="3"/><rect x="660" y="175" width="120" height="80" rx="12" fill="#f2eaff"/><text x="720" y="222" text-anchor="middle" class="lab">PLAN</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Confirm acuity and test conditions</text><text x="425" y="393" class="sm">• Retinoscopy / autorefraction</text><text x="75" y="412" class="sm">• CHECK OCULAR HEALTH</text><text x="425" y="412" class="sm">• Refer if unexplained or urgent signs</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor=