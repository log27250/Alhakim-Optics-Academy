<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Cycloplegic Refraction</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-027-L01 | Cycloplegic Refraction</text><rect x="70" y="150" width="300" height="130" rx="14" fill="#fff0dc"/><text x="220" y="195" text-anchor="middle" class="lab">ACCOMMODATION</text><text x="220" y="230" text-anchor="middle" class="sm">Active response</text><path d="M370 215 H450" stroke="#287cb5" stroke-width="4"/><rect x="450" y="150" width="300" height="130" rx="14" fill="#e9f8f2"/><text x="600" y="195" text-anchor="middle" class="lab">CYCLOPLEGIA</text><text x="600" y="230" text-anchor="middle" class="sm">Reduced temporarily</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">CLINICAL POINTS</text><text x="75" y="393" class="sm">• May mask latent hyperopia</text><text x="425" y="393" class="sm">• Temporarily reduces accommodation</text><text x="75" y="412" class="sm">• Use when clinically indicated</text><text x="425" y="412" class="sm">• Drug choice, contraindications and counselling matter</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CYCLOPLEGIC ASSESSMENT</text></svg>