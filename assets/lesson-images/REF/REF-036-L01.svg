<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t d"><title id="t">Transposition of Ophthalmic Prescriptions</title><desc id="d">Clinical teaching diagram: Transposition of Ophthalmic Prescriptions</desc><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:#fff}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:#fff}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">REF-036-L01 | Transposition of Ophthalmic Prescriptions</text><rect x="75" y="155" width="270" height="125" rx="14" fill="#eaf4ff"/><text x="210" y="190" text-anchor="middle" class="lab">+2.00 / −1.00 × 180</text><text x="210" y="230" text-anchor="middle" class="sm">Original notation</text><path d="M350 215 H465" stroke="#287cb5" stroke-width="4"/><path d="M450 200 L465 215 L450 230" fill="none" stroke="#287cb5" stroke-width="4"/><rect x="475" y="155" width="270" height="125" rx="14" fill="#e9f8f2"/><text x="610" y="190" text-anchor="middle" class="lab">+1.00 / +1.00 × 90</text><text x="610" y="230" text-anchor="middle" class="sm">Equivalent notation</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">KEY CLINICAL POINTS</text><text x="75" y="393" class="sm">• Add sphere + cylinder</text><text x="425" y="393" class="sm">• Reverse cylinder sign</text><text x="75" y="412" class="sm">• Rotate axis by 90°</text><text x="425" y="412" class="sm">• Verify both principal meridians</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">EQUIVALENT LENS</text></svg>