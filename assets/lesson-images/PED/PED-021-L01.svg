<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Intermittent Exotropia in Childhood</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">PED-021-L01 | Intermittent Exotropia in Childhood</text><circle cx="215" cy="215" r="72" fill="#e9f8f2" stroke="#26966d" stroke-width="4"/><text x="215" y="220" text-anchor="middle" class="lab">CONTROL</text><path d="M290 215 H450" stroke="#287cb5" stroke-width="4"/><circle cx="590" cy="215" r="72" fill="#fff0dc" stroke="#d49a42" stroke-width="4"/><text x="590" y="220" text-anchor="middle" class="lab">DRIFT OUT</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">PEDIATRIC CLINICAL POINTS</text><text x="75" y="393" class="sm">• Maintains alignment</text><text x="425" y="393" class="sm">• One eye drifts outward</text><text x="75" y="412" class="sm">• Assess frequency and recovery</text><text x="425" y="412" class="sm">• Control may vary with fatigue / distance</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">INTERMITTENT EXOTROPIA</text></svg>