ular motility</text></g><g transform="translate(675 0)"><rect width="190" height="210" rx="18" fill="#e2eef4" stroke="#8baabd" stroke-width="2"/><circle cx="95" cy="62" r="33" fill="#fff" stroke="#327b98" stroke-width="4"/><text x="95" y="125" text-anchor="middle" font-size="20" font-weight="700" fill="#173b59">Use both eyes</text><text x="95" y="160" text-anchor="middle" font-size="16" fill="#36536d">Binocular function</text></g></g><path d="M170 445H830" stroke="#d49a3d" stroke-width="5"/><text x="500" y="500" text-anchor="middle" fill="#173b59" font-size="21">Vision assessment can identify treatable problems — it does not diagnose dyslexia</text><text x="50" y="590" fill="#58758a" font-family="Arial,sans-serif" font-size="15">PED-032-L01 • HAKIM OPTICS ACADEMY • Educational schematic — correlate with clinical findings</text></svg>