<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Myopia in Childhood</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">PED-014-L01 | Myopia in Childhood</text><path d="M90 215 H730" stroke="#287cb5" stroke-width="4"/><path d="M250 160 L310 215 L250 270" fill="none" stroke="#26966d" stroke-width="5"/><rect x="360" y="155" width="270" height="120" rx="14" fill="#e9f8f2"/><text x="495" y="195" text-anchor="middle" class="lab">AXIAL GROWTH</text><text x="495" y="230" text-anchor="middle" class="sm">Myopia progression</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">PEDIATRIC CLINICAL POINTS</text><text x="75" y="393" class="sm">• Eye length increases</text><text x="425" y="393" class="sm">• Distant image in front of retina</text><text x="75" y="412" class="sm">• Monitor progression and risk factors</text><text x="425" y="412" class="sm">• Correction and myopia control are distinct goals</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CHILDHOOD MYOPIA</text></svg>