<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Astigmatism in Children</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">PED-016-L01 | Astigmatism in Children</text><circle cx="210" cy="215" r="78" fill="#fff" stroke="#287cb5" stroke-width="3"/><path d="M132 215 H288 M210 137 V293" stroke="#287cb5" stroke-width="5"/><text x="210" y="330" text-anchor="middle" class="lab">Two principal meridians</text><rect x="470" y="155" width="260" height="120" rx="14" fill="#e9f8f2"/><text x="600" y="195" text-anchor="middle" class="lab">CYLINDER</text><text x="600" y="230" text-anchor="middle" class="sm">Axis + power</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">PEDIATRIC CLINICAL POINTS</text><text x="75" y="393" class="sm">• Different refractive power</text><text x="425" y="393" class="sm">• Second principal meridian</text><text x="75" y="412" class="sm">• Uncorrected blur may affect development</text><text x="425" y="412" class="sm">• Assess axis and regularity</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CHILDHOOD ASTIGMATISM</text></svg>