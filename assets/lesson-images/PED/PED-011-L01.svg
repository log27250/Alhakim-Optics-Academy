<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Pediatric Binocular Vision Assessment</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">PED-011-L01 | Pediatric Binocular Vision Assessment</text><circle cx="200" cy="215" r="65" fill="#eaf4ff" stroke="#287cb5" stroke-width="3"/><text x="200" y="220" text-anchor="middle" class="lab">OD</text><circle cx="620" cy="215" r="65" fill="#e9f8f2" stroke="#26966d" stroke-width="3"/><text x="620" y="220" text-anchor="middle" class="lab">OS</text><path d="M265 215 H555" stroke="#287cb5" stroke-width="4"/><text x="410" y="190" text-anchor="middle" class="sm">Fusion → single vision</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">PEDIATRIC CLINICAL POINTS</text><text x="75" y="393" class="sm">• Cover tests at distance / near</text><text x="425" y="393" class="sm">• Sensory integration</text><text x="75" y="412" class="sm">• STEREOPSIS</text><text x="425" y="412" class="sm">• Depth perception</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">BINOCULAR FUNCTION</text></svg>