<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 470" role="img" aria-labelledby="t"><title id="t">Congenital Glaucoma</title><style>text{font-family:Arial,sans-serif;fill:#17354c}.hd{font-size:24px;font-weight:bold;fill:white}.lab{font-size:18px;font-weight:bold}.sm{font-size:14px}.ft{font-size:15px;font-weight:bold;fill:white}</style><rect width="820" height="470" rx="22" fill="#f4f8fc"/><rect x="24" y="24" width="772" height="68" rx="14" fill="#123e5c"/><text x="48" y="66" class="hd">PED-023-L01 | Congenital Glaucoma</text><path d="M100 215 Q220 125 340 215 Q220 305 100 215" fill="#eaf4ff" stroke="#287cb5" stroke-width="4"/><path d="M160 165 Q220 130 280 165" fill="none" stroke="#c65a5a" stroke-width="5"/><path d="M365 215 H470" stroke="#287cb5" stroke-width="4"/><rect x="485" y="155" width="250" height="120" rx="14" fill="#f8e2e2"/><text x="610" y="195" text-anchor="middle" class="lab">IOP / OPTIC NERVE</text><text x="610" y="230" text-anchor="middle" class="sm">Urgent assessment</text><rect x="50" y="335" width="720" height="82" rx="14" fill="#fff" stroke="#d4e1eb"/><text x="75" y="365" class="lab">PEDIATRIC CLINICAL POINTS</text><text x="75" y="393" class="sm">• Aqueous outflow impaired</text><text x="425" y="393" class="sm">• Pressure may damage optic nerve</text><text x="75" y="412" class="sm">• Enlarged cloudy cornea / tearing / photophobia</text><text x="425" y="412" class="sm">• Urgent specialist assessment</text><rect x="24" y="432" width="772" height="26" rx="8" fill="#17628b"/><text x="410" y="451" text-anchor="middle" class="ft">CHILDHOOD GLAUCOMA</text></svg>