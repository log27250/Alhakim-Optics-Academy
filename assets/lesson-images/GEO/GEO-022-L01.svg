<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">COMBINATION OF THIN LENSES</text><path d="M360 190 Q290 325 360 460 Q430 325 360 190Z" fill="#d5efff" stroke="#2878b9" stroke-width="5"/><path d="M610 190 Q540 325 610 460 Q680 325 610 190Z" fill="#d5efff" stroke="#27945b" stroke-width="5"/><path d="M100 325 L850 325" stroke="#7a8fa4" stroke-width="3" stroke-dasharray="9 8"/><path d="M100 250 L360 325 L610 325 L900 180 M100 400 L360 325 L610 325 L900 470" stroke="#e28a20" stroke-width="5" fill="none"/><text x="360" y="500" text-anchor="middle" font-family="Arial" font-size="22" fill="#155b91">F₁</text><text x="610" y="500" text-anchor="middle" font-family="Arial" font-size="22" fill="#176c40">F₂</text><rect x="140" y="535" width="820" height="75" rx="16" fill="#e8f4ff"/><text x="550" y="580" text-anchor="middle" font-family="Arial" font-size="24" fill="#155b91">In contact (thin lenses in air): Fₑq = F₁ + F₂</text><text x="550" y="635" text-anchor="middle" font-family="Arial" font-size="17" fill="#567">Separated lenses require the vergence / separation relationship.</text></svg>