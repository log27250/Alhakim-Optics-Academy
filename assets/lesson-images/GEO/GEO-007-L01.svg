<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#123c61">RECTILINEAR PROPAGATION OF LIGHT</text><g font-family="Arial"><rect x="65" y="130" width="510" height="470" rx="24" fill="#fff" stroke="#9bb4ca" stroke-width="3"/><text x="320" y="185" text-anchor="middle" font-size="27" font-weight="bold" fill="#155b91">PINHOLE CAMERA</text><rect x="125" y="260" width="70" height="200" fill="#e9a34b"/><circle cx="160" cy="300" r="18" fill="#fff"/><circle cx="160" cy="420" r="18" fill="#123c61"/><path d="M195 300 L365 360 M195 420 L365 360" stroke="#e28a20" stroke-width="5"/><rect x="365" y="250" width="22" height="220" fill="#7d91a6"/><circle cx="376" cy="360" r="6" fill="#fff"/><path d="M376 360 L520 300 M376 360 L520 420" stroke="#e28a20" stroke-width="4"/><rect x="520" y="250" width="15" height="220" fill="#d7eaff" stroke="#2878b9" stroke-width="3"/><circle cx="528" cy="300" r="14" fill="#123c61"/><circle cx="528" cy="420" r="14" fill="#fff" stroke="#123c61" stroke-width="3"/><text x="320" y="540" text-anchor="middle" font-size="19" fill="#456">Image is inverted at the screen</text><rect x="625" y="130" width="510" height="470" rx="24" fill="#fff" stroke="#9bb4ca" stroke-width="3"/><text x="880" y="185" text-anchor="middle" font-size="27" font-weight="bold" fill="#155b91">SHADOW FORMATION</text><circle cx="740" cy="360" r="34" fill="#f4c85b"/><path d="M775 330 L940 265 M775 390 L940 455" stroke="#e28a20" stroke-width="5"/><rect x="940" y="260" width="24" height="200" fill="#6d7e91"/><path d="M964 260 L1090 215 L1090 505 L964 460Z" fill="#c9d6e2" opacity=".8"/><path d="M964 260 L1090 300 L1090 420 L964 460Z" fill="#455a70" opacity=".9"/><text x="880" y="540" text-anchor="middle" font-size="19" fill="#456">Opaque object blocks direct rays</text><rect x="115" y="650" width="970" height="65" rx="18" fill="#fff3e8"/><text x="600" y="692" text-anchor="middle" font-size="22" fill="#a34c20">Straight-line propagation applies in a uniform medium within the ray-optics approximation.</text></g></svg>