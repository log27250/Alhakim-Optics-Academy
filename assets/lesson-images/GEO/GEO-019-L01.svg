<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">IMAGE FORMATION BY A CONVERGING LENS</text><path d="M550 160 Q430 325 550 490 Q670 325 550 160Z" fill="#d5efff" stroke="#2878b9" stroke-width="5"/><path d="M140 325 L950 325" stroke="#7a8fa4" stroke-width="3" stroke-dasharray="9 8"/><path d="M280 250 L280 325 L280 400" stroke="#123c61" stroke-width="8"/><path d="M280 250 L260 275 M280 250 L300 275" stroke="#123c61" stroke-width="4"/><path d="M280 250 L550 325 L820 400" stroke="#e28a20" stroke-width="5" fill="none"/><path d="M280 250 L550 250 L820 400" stroke="#27945b" stroke-width="5" fill="none"/><path d="M820 400 L800 375 M820 400 L790 405" stroke="#d34d61" stroke-width="5"/><path d="M820 325 L820 400" stroke="#d34d61" stroke-width="8"/><text x="280" y="220" text-anchor="middle" font-family="Arial" font-size="20" fill="#234">Object</text><text x="820" y="450" text-anchor="middle" font-family="Arial" font-size="20" fill="#234">Real, inverted image</text><text x="550" y="545" text-anchor="middle" font-family="Arial" font-size="21" fill="#123c61">Real image: rays actually converge and can be projected onto a screen.</text><text x="550" y="590" text-anchor="middle" font-family="Arial" font-size="19" fill="#456">Virtual image: backward ray extensions appear to meet; it cannot be projected there.</text></svg>