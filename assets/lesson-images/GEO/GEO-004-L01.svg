<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#123c61">ELECTROMAGNETIC SPECTRUM</text><text x="600" y="108" text-anchor="middle" font-family="Arial" font-size="21" fill="#456">Long wavelength / low frequency → short wavelength / high frequency</text><g font-family="Arial"><rect x="65" y="210" width="150" height="150" fill="#8da6c2"/><rect x="215" y="210" width="150" height="150" fill="#5c9db5"/><rect x="365" y="210" width="150" height="150" fill="#e6a45a"/><rect x="515" y="210" width="170" height="150" fill="url(#vis)"/><rect x="685" y="210" width="150" height="150" fill="#8b72c2"/><rect x="835" y="210" width="150" height="150" fill="#4772b8"/><rect x="985" y="210" width="150" height="150" fill="#384a78"/><defs><linearGradient id="vis"><stop stop-color="#7551b5"/><stop offset=".2" stop-color="#347bc4"/><stop offset=".4" stop-color="#36a66b"/><stop offset=".6" stop-color="#e1cf3e"/><stop offset=".8" stop-color="#e68a32"/><stop offset="1" stop-color="#d84b43"/></linearGradient></defs><g font-size="22" fill="#fff" font-weight="bold" text-anchor="middle"><text x="140" y="295">RADIO</text><text x="290" y="295">MICROWAVE</text><text x="440" y="295">INFRARED</text><text x="600" y="295">VISIBLE</text><text x="760" y="295">UV</text><text x="910" y="295">X-RAY</text><text x="1060" y="295">GAMMA</text></g><g font-size="19" fill="#234" text-anchor="middle"><text x="140" y="395">Longest λ</text><text x="290" y="395"> </text><text x="440" y="395"> </text><text x="600" y="395">380–780 nm*</text><text x="760" y="395"> </text><text x="910" y="395"> </text><text x="1060" y="395">Shortest λ</text></g><path d="M85 460 L1115 460" stroke="#123c61" stroke-width="4"/><path d="M1100 445 L1120 460 L1100 475" fill="none" stroke="#123c61" stroke-width="4"/><text x="600" y="505" text-anchor="middle" font-size="23" fill="#123c61">Increasing frequency and photon energy →</text><rect x="125" y="560" width="950" height="115" rx="20" fill="#e8f4ff" stroke="#2878b9" stroke-width="3"/><text x="600" y="605" text-anchor="middle" font-size="26" font-weight="bold" fill="#155b91">VISIBLE LIGHT AND HUMAN VISION</text><text x="600" y="645" text-anchor="middle" font-size="21" fill="#234">Approximate range: 380–780 nm; limits vary with observer and conditions.</text><text x="600" y="715" text-anchor="middle" font-size="17" fill="#567">Schematic spectrum — band widths are not to scale. *Approximate visible range.</text></g></svg>