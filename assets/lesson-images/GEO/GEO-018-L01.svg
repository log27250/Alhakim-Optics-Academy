<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">LENS POWER AND DIOPTRIC MEASUREMENT</text><path d="M240 180 Q110 325 240 470 Q370 325 240 180Z" fill="#d5efff" stroke="#2878b9" stroke-width="5"/><path d="M240 325 L490 325" stroke="#e28a20" stroke-width="6"/><path d="M490 325 L470 305 M490 325 L470 345" stroke="#e28a20" stroke-width="5"/><text x="240" y="520" text-anchor="middle" font-family="Arial" font-size="21" fill="#234">Converging lens</text><rect x="590" y="155" width="390" height="300" rx="22" fill="#e8f4ff" stroke="#2878b9" stroke-width="3"/><text x="785" y="215" text-anchor="middle" font-family="Arial" font-size="26" fill="#155b91">POWER = 1 / f</text><text x="785" y="285" text-anchor="middle" font-family="Arial" font-size="25" fill="#234">f = 0.50 m</text><text x="785" y="345" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold" fill="#123c61">+2.00 D</text><text x="785" y="405" text-anchor="middle" font-family="Arial" font-size="19" fill="#456">Dioptre = m⁻¹</text><rect x="130" y="565" width="840" height="55" rx="14" fill="#fff3e8"/><text x="550" y="600" text-anchor="middle" font-family="Arial" font-size="20" fill="#a34c20">A lensmeter verifies back-vertex power and cylinder / axis in spectacle lenses.</text></svg>