<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#123c61">GEOMETRICAL OPTICS: RAY APPROXIMATION</text><g font-family="Arial"><rect x="65" y="135" width="1070" height="480" rx="24" fill="#fff" stroke="#9bb4ca" stroke-width="3"/><text x="600" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#123c61">RAY BUNDLES AND A CONVERGING LENS</text><path d="M600 235 Q520 370 600 505 Q680 370 600 235Z" fill="#d5efff" stroke="#2878b9" stroke-width="5"/><path d="M120 285 L600 370 M120 370 L600 370 M120 455 L600 370" stroke="#e28a20" stroke-width="5" fill="none"/><path d="M600 370 L1030 250 M600 370 L1030 370 M600 370 L1030 490" stroke="#e28a20" stroke-width="5" fill="none"/><circle cx="600" cy="370" r="8" fill="#d34d61"/><text x="160" y="255" font-size="21" fill="#234">Parallel incident rays</text><text x="870" y="220" font-size="21" fill="#234">Focus (F)</text><path d="M1030 235 L1030 505" stroke="#d34d61" stroke-width="3" stroke-dasharray="8 8"/><text x="600" y="565" text-anchor="middle" font-size="19" fill="#456">A ray represents the direction of energy propagation.</text><rect x="110" y="650" width="980" height="65" rx="18" fill="#e8f4ff"/><text x="600" y="692" text-anchor="middle" font-size="22" fill="#155b91">Useful when optical components are much larger than the wavelength; diffraction may then be neglected.</text></g></svg>