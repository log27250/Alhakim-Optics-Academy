<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">SPHERICAL MIRRORS: CONCAVE AND CONVEX</text><g font-family="Arial"><text x="275" y="125" text-anchor="middle" font-size="26" fill="#155b91">CONCAVE (CONVERGING)</text><path d="M275 175 Q80 330 275 485" fill="none" stroke="#526b82" stroke-width="12"/><path d="M70 210 L275 330 M70 330 L275 330 M70 450 L275 330" stroke="#e28a20" stroke-width="5" fill="none"/><circle cx="275" cy="330" r="7" fill="#d34d61"/><text x="290" y="355" font-size="20" fill="#234">F</text><text x="275" y="535" text-anchor="middle" font-size="18" fill="#456">Parallel rays converge at F</text><text x="825" y="125" text-anchor="middle" font-size="26" fill="#155b91">CONVEX (DIVERGING)</text><path d="M825 175 Q1020 330 825 485" fill="none" stroke="#526b82" stroke-width="12"/><path d="M625 210 L825 330 M625 330 L825 330 M625 450 L825 330" stroke="#e28a20" stroke-width="5" fill="none"/><path d="M825 330 L990 230 M825 330 L990 330 M825 330 L990 430" stroke="#2878b9" stroke-width="4" stroke-dasharray="9 8"/><circle cx="990" cy="330" r="7" fill="#d34d61"/><text x="1000" y="355" font-size="20" fill="#234">F (virtual)</text><text x="825" y="535" text-anchor="middle" font-size="18" fill="#456">Reflected rays diverge; extensions meet behind</text></g><text x="550" y="605" text-anchor="middle" font-family="Arial" font-size="18" fill="#567">Schematic principal-axis ray diagrams; paraxial approximation.</text></svg>