<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#123c61">PHYSICAL QUANTITIES &amp; OPTICAL UNITS</text><g font-family="Arial"><rect x="65" y="125" width="510" height="250" rx="22" fill="#e8f4ff" stroke="#2878b9" stroke-width="4"/><text x="320" y="175" text-anchor="middle" font-size="29" font-weight="bold" fill="#155b91">WAVE RELATIONSHIP</text><path d="M110 270 Q150 200 190 270 T270 270 T350 270 T430 270 T510 270" fill="none" stroke="#2c8aaf" stroke-width="6"/><path d="M110 315 L270 315" stroke="#e28a20" stroke-width="4"/><path d="M110 300 L110 330 M270 300 L270 330" stroke="#e28a20" stroke-width="4"/><text x="190" y="350" text-anchor="middle" font-size="20" fill="#234">λ = wavelength</text><text x="430" y="230" text-anchor="middle" font-size="28" fill="#123c61">v = fλ</text><text x="320" y="405" text-anchor="middle" font-size="18" fill="#456">Speed = frequency × wavelength</text><rect x="625" y="125" width="510" height="250" rx="22" fill="#eaf7ef" stroke="#27945b" stroke-width="4"/><text x="880" y="175" text-anchor="middle" font-size="29" font-weight="bold" fill="#176c40">REFRACTIVE INDEX</text><rect x="700" y="215" width="360" height="90" rx="14" fill="#d4e8fa"/><path d="M730 260 L1030 260" stroke="#e28a20" stroke-width="6"/><text x="880" y="250" text-anchor="middle" font-size="30" fill="#123c61">n = c / v</text><text x="880" y="345" text-anchor="middle" font-size="19" fill="#234">Dimensionless • higher n means lower phase speed</text><rect x="65" y="430" width="510" height="245" rx="22" fill="#fff3e8" stroke="#d77a42" stroke-width="4"/><text x="320" y="480" text-anchor="middle" font-size="29" font-weight="bold" fill="#a34c20">LENS POWER</text><path d="M160 545 Q235 500 310 545 Q235 590 160 545Z" fill="#bfe4fa" stroke="#2878b9" stroke-width="5"/><path d="M310 545 L420 545" stroke="#e28a20" stroke-width="5"/><text x="320" y="625" text-anchor="middle" font-size="31" fill="#123c61">P = 1 / f (metres)</text><text x="320" y="655" text-anchor="middle" font-size="18" fill="#456">+2.00 D → f = +0.50 m</text><rect x="625" y="430" width="510" height="245" rx="22" fill="#f0edff" stroke="#7563b5" stroke-width="4"/><text x="880" y="480" text-anchor="middle" font-size="29" font-weight="bold" fill="#55428d">COMMON UNITS</text><g font-size="24" fill="#234"><text x="700" y="540">Length</text><text x="1010" y="540" text-anchor="end">m • mm • µm • nm</text><text x="700" y="585">Frequency</text><text x="1010" y="585" text-anchor="end">Hz (s⁻¹)</text><text x="700" y="630">Optical power</text><text x="1010" y="630" text-anchor="end">dioptre (m⁻¹)</text></g></g></svg>