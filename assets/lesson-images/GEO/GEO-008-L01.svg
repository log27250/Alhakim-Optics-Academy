<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#f7f9fc"/><text x="600" y="62" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#123c61">REFLECTION OF LIGHT: LAW AND GEOMETRY</text><g font-family="Arial"><rect x="75" y="130" width="1050" height="500" rx="24" fill="#fff" stroke="#9bb4ca" stroke-width="3"/><text x="600" y="190" text-anchor="middle" font-size="27" font-weight="bold" fill="#155b91">ANGLE OF INCIDENCE = ANGLE OF REFLECTION</text><path d="M180 475 L1020 475" stroke="#526b82" stroke-width="9"/><path d="M600 235 L600 555" stroke="#7a8fa4" stroke-width="3" stroke-dasharray="10 8"/><path d="M350 270 L600 475 L850 270" fill="none" stroke="#e28a20" stroke-width="7"/><path d="M580 450 L600 475 L620 450" fill="none" stroke="#e28a20" stroke-width="5"/><path d="M830 290 L850 270 L870 290" fill="none" stroke="#e28a20" stroke-width="5"/><path d="M580 475 A100 100 0 0 0 520 395" fill="none" stroke="#2878b9" stroke-width="4"/><path d="M620 475 A100 100 0 0 1 680 395" fill="none" stroke="#27945b" stroke-width="4"/><text x="505" y="390" font-size="24" fill="#2878b9">i</text><text x="690" y="390" font-size="24" fill="#27945b">r</text><text x="615" y="245" font-size="20" fill="#456">Normal</text><text x="340" y="245" font-size="21" fill="#a34c20">Incident ray</text><text x="860" y="245" font-size="21" fill="#a34c20">Reflected ray</text><text x="600" y="520" text-anchor="middle" font-size="20" fill="#234">Reflecting surface</text><text x="600" y="585" text-anchor="middle" font-size="20" fill="#123c61">Angles are measured from the normal, not from the surface.</text></g></svg>