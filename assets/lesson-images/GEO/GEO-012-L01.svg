<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">REFRACTIVE INDEX AND OPTICAL DENSITY</text><rect x="100" y="140" width="900" height="360" rx="22" fill="#e7f2fb" stroke="#2878b9" stroke-width="3"/><text x="550" y="195" text-anchor="middle" font-family="Arial" font-size="27" fill="#155b91">Phase refractive index: n = c / v</text><g font-family="Arial"><rect x="180" y="250" width="300" height="160" rx="16" fill="#d5ebfb" stroke="#2878b9" stroke-width="3"/><rect x="620" y="250" width="300" height="160" rx="16" fill="#d5f1e1" stroke="#27945b" stroke-width="3"/><text x="330" y="300" text-anchor="middle" font-size="25" fill="#234">Lower n</text><text x="330" y="350" text-anchor="middle" font-size="22" fill="#234">Higher phase speed</text><path d="M230 380 L430 380" stroke="#e28a20" stroke-width="5"/><text x="770" y="300" text-anchor="middle" font-size="25" fill="#234">Higher n</text><text x="770" y="350" text-anchor="middle" font-size="22" fill="#234">Lower phase speed</text><path d="M670 380 L870 380" stroke="#27945b" stroke-width="5"/></g><rect x="140" y="535" width="820" height="70" rx="16" fill="#fff3e8"/><text x="550" y="578" text-anchor="middle" font-family="Arial" font-size="22" fill="#a34c20">n is dimensionless; it depends on wavelength and material conditions.</text><text x="550" y="630" text-anchor="middle" font-family="Arial" font-size="17" fill="#567">Optical density (refractive index) is distinct from mass density.</text></svg>