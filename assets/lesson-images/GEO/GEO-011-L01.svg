<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">REFRACTION AND SNELL'S LAW</text><rect x="100" y="325" width="900" height="230" fill="#dceefa"/><path d="M100 325 L1000 325" stroke="#526b82" stroke-width="4"/><path d="M550 130 L550 520" stroke="#7a8fa4" stroke-width="3" stroke-dasharray="10 8"/><path d="M300 150 L550 325 L680 520" stroke="#e28a20" stroke-width="7" fill="none"/><path d="M300 150 L550 325" stroke="#e28a20" stroke-width="7"/><path d="M680 520 L665 490 M680 520 L695 495" stroke="#e28a20" stroke-width="6"/><path d="M550 325 L550 520" stroke="#7a8fa4" stroke-width="3"/><text x="210" y="145" font-family="Arial" font-size="23" fill="#234">n₁ (air)</text><text x="210" y="390" font-family="Arial" font-size="23" fill="#234">n₂ (glass / water)</text><text x="450" y="260" font-family="Arial" font-size="24" fill="#155b91">θ₁</text><text x="585" y="405" font-family="Arial" font-size="24" fill="#176c40">θ₂</text><text x="550" y="595" text-anchor="middle" font-family="Arial" font-size="26" fill="#123c61">n₁ sin θ₁ = n₂ sin θ₂</text><text x="550" y="625" text-anchor="middle" font-family="Arial" font-size="17" fill="#567">Angles measured from the normal; frequency remains constant at a stationary boundary.</text></svg>