<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 650"><rect width="1100" height="650" fill="#f7f9fc"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="bold" fill="#123c61">TOTAL INTERNAL REFLECTION AND OPTICAL FIBRE</text><rect x="100" y="155" width="900" height="330" rx="24" fill="#dceefa" stroke="#2878b9" stroke-width="3"/><text x="550" y="205" text-anchor="middle" font-family="Arial" font-size="24" fill="#155b91">Higher refractive index core (n₁) surrounded by lower-index cladding (n₂)</text><path d="M160 270 L330 410 L500 270 L670 410 L840 270 L950 360" fill="none" stroke="#e28a20" stroke-width="8"/><path d="M160 255 L950 255 M160 425 L950 425" stroke="#2878b9" stroke-width="5"/><text x="550" y="455" text-anchor="middle" font-family="Arial" font-size="20" fill="#234">Repeated internal reflections guide light along the fibre.</text><rect x="130" y="525" width="840" height="80" rx="16" fill="#eaf7ef"/><text x="550" y="560" text-anchor="middle" font-family="Arial" font-size="22" fill="#176c40">Conditions: n₁ &gt; n₂ and incidence angle &gt; critical angle</text><text x="550" y="590" text-anchor="middle" font-family="Arial" font-size="20" fill="#176c40">sin θc = n₂ / n₁</text><text x="550" y="632" text-anchor="middle" font-family="Arial" font-size="17" fill="#567">Idealized ray path; real fibres also have losses and finite numerical aperture.</text></svg>