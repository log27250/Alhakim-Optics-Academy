<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Amblyopia management sequence</title><desc id="d">Clinical sequence: identify cause, correct refractive error, clinician-directed occlusion or penalization, and monitor response.</desc><rect width="800" height="430" fill="#fff"/><text x="35" y="45" font-family="Arial" font-size="25" fill="#17324d">Amblyopia: management principles</text><g font-family="Arial" font-size="20" text-anchor="middle"><rect x="45" y="110" width="160" height="100" rx="14" fill="#e8f2fa" stroke="#28627f" stroke-width="3"/><text x="125" y="150" fill="#17324d">Identify</text><text x="125" y="180" fill="#17324d">cause</text><rect x="235" y="110" width="160" height="100" rx="14" fill="#edf5e9" stroke="#54834b" stroke-width="3"/><text x="315" y="150" fill="#17324d">Correct</text><text x="315" y="180" fill="#17324d">refraction</text><rect x="425" y="110" width="160" height="100" rx="14" fill="#fff4df" stroke="#b77b16" stroke-width="3"/><text x="505" y="150" fill="#17324d">Consider</text><text x="505" y="180" fill="#17324d">occlusion /</text><text x="505" y="202" fill="#17324d">penalization</text><rect x="615" y="110" width="145" height="100" rx="14" fill="#f2eafa" stroke="#79539b" stroke-width="3"/><text x="687" y="150" fill="#17324d">Monitor</text><text x="687" y="180" fill="#17324d">response</text></g><g stroke="#555" stroke-width="4" fill="none"><path d="M205 160 H230 M220 150 L232 160 L220 170 M395 160 H420 M410 150 L422 160 L410 170 M585 160 H610 M600 150 L612 160 L600 170"/></g><text x="50" y="290" font-family="Arial" font-size="19" fill="#333">Treatment is individualized by age, cause, severity and response.</text><text x="50" y="330" font-family="Arial" font-size="19" fill="#333">Occlusion or pharmacological penalization must be prescribed and monitored</text><text x="50" y="360" font-family="Arial" font-size="19" fill="#333">by an appropriately qualified eye-care clinician.</text></svg>