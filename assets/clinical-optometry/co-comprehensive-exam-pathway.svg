<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Comprehensive eye examination pathway</title><desc id="d">Clinical examination stages and decision integration.</desc><rect width="1000" height="650" rx="24" fill="#f7fafc"/><text x="500" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">COMPREHENSIVE EYE EXAMINATION</text><g font-family="Arial" font-size="19" text-anchor="middle" fill="#17324d" stroke="#52748a" stroke-width="2"><rect x="60" y="100" width="250" height="78" rx="14" fill="#eaf4ff"/><text x="185" y="132" stroke="none">Consent + chief complaint</text><text x="185" y="157" stroke="none">History</text><rect x="375" y="100" width="250" height="78" rx="14" fill="#eaf4ff"/><text x="500" y="132" stroke="none">Visual function</text><text x="500" y="157" stroke="none">VA + preliminary tests</text><rect x="690" y="100" width="250" height="78" rx="14" fill="#eaf4ff"/><text x="815" y="132" stroke="none">Refraction</text><text x="815" y="157" stroke="none">Objective + subjective</text><path d="M310 139H375M625 139H690" stroke="#52748a" stroke-width="3"/><rect x="60" y="270" width="250" height="88" rx="14" fill="#e8f5ef"/><text x="185" y="304" stroke="none">Binocular vision</text><text x="185" y="331" stroke="none">When indicated</text><rect x="375" y="270" width="250" height="88" rx="14" fill="#e8f5ef"/><text x="500" y="304" stroke="none">Anterior segment</text><text x="500" y="331" stroke="none">+ IOP when appropriate</text><rect x="690" y="270" width="250" height="88" rx="14" fill="#e8f5ef"/><text x="815" y="304" stroke="none">Posterior segment</text><text x="815" y="331" stroke="none">+ visual field as indicated</text><path d="M815 178V220H185V270M500 178V270M815 220V270" fill="none" stroke="#52748a" stroke-width="3"/><rect x="210" y="455" width="580" height="105" rx="18" fill="#dceafe" stroke="#315c83" stroke-width="2"/><text x="500" y="493" stroke="none" fo