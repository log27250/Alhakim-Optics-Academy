<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#f5f8fb"/><text x="600" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="700" fill="#17324d">VISUAL FUNCTIONS REQUIRED FOR DRIVING</text><g transform="translate(600 350)"><circle r="210" fill="#e4f1f8" stroke="#2d6f91" stroke-width="5"/><circle r="130" fill="#fff" stroke="#2d6f91" stroke-width="4"/><path d="M-160 35h320l-45-95h-230z" fill="#b8d7e8" stroke="#17324d" stroke-width="8"/><circle cx="-80" cy="48" r="25" fill="#17324d"/><circle cx="80" cy="48" r="25" fill="#17324d"/><path d="M0-170v-65M0 170v65M170 0h65M-170 0h-65" stroke="#e18a35" stroke-width="8" stroke-linecap="round"/></g><g font-family="Arial" font-size="23" font-weight="700" fill="#17324d"><text x="600" y="120" text-anchor="middle">Visual acuity</text><text x="600" y="650" text-anchor="middle">Visual field • contrast • glare • binocular function</text><text x="90" y="355">Peripheral field</text><text x="1110" y="355" text-anchor="end">Depth judgement</text></g><text x="600" y="690" text-anchor="middle" font-family="Arial" font-size="17" fill="#52677a">Acuity alone cannot establish fitness to drive; apply current local licensing standards.</text></svg>