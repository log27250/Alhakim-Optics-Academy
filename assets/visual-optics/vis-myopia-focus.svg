<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Myopia: Optical Focus</title><desc id="d">Parallel rays focus anterior to the retina in an uncorrected myopic eye</desc><rect width="1000" height="620" rx="26" fill="#f4f8fb"/><text x="500" y="54" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173b57">Myopia: Optical Focus</text><text x="500" y="88" text-anchor="middle" font-family="Arial" font-size="17" fill="#45657b">Parallel rays focus anterior to the retina in an uncorrected myopic eye</text><ellipse cx="500" cy="320" rx="270" ry="160" fill="#e5f1f7" stroke="#1686b5" stroke-width="5"/><path d="M740 220Q700 320 740 420" stroke="#d88c2b" stroke-width="10" fill="none"/><path d="M650 220V420" stroke="#398b7a" stroke-width="5"/><path d="M90 250L420 300L575 320M90 320L420 320L575 320M90 390L420 340L575 320" stroke="#1686b5" stroke-width="5" fill="none"/><path d="M575 285V355" stroke="#c74b4b" stroke-width="5"/><text x="110" y="210" font-size="22" fill="#173b57">Parallel rays</text><text x="510" y="280" font-size="20" fill="#c74b4b">Anterior focus</text><text x="760" y="320" font-size="20" fill="#173b57">Retina</text><text x="500" y="520" text-anchor="middle" font-size="22" fill="#173b57">A minus lens moves the focal plane posteriorly</text><text x="500" y="590" text-anchor="middle" font-family="Arial" font-size="14" fill="#61798b">HAKIM OPTICS ACADEMY · EDUCATIONAL SCHEMATIC</text></svg>