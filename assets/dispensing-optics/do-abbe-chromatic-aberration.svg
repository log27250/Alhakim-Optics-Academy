<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Abbe value and chromatic aberration</title><desc id="d">Schematic comparison showing greater wavelength separation with lower Abbe value and less separation with higher Abbe value.</desc><rect width="800" height="420" fill="#fff"/><text x="35" y="45" font-family="Arial" font-size="25" fill="#17324d">Abbe value and chromatic aberration</text><text x="200" y="100" text-anchor="middle" font-family="Arial" font-size="22" fill="#17324d">Lower Abbe value</text><text x="600" y="100" text-anchor="middle" font-family="Arial" font-size="22" fill="#17324d">Higher Abbe value</text><path d="M80 210 H270 M530 210 H720" stroke="#d28a00" stroke-width="5"/><path d="M270 210 L330 130 M270 210 L330 210 M270 210 L330 290 M530 210 L590 190 M530 210 L590 210 M530 210 L590 230" stroke-width="5" fill="none"/><g stroke-width="5"><path d="M330 130 L460 70" stroke="#b23a48"/><path d="M330 210 L460 210" stroke="#26965b"/><path d="M330 290 L460 350" stroke="#2878c7"/><path d="M590 190 L730 170" stroke="#b23a48"/><path d="M590 210 L730 210" stroke="#26965b"/><path d="M590 230 L730 250" stroke="#2878c7"/></g><text x="400" y="390" text-anchor="middle" font-family="Arial" font-size="18" fill="#555">Conceptual illustration only; actual performance depends on material and lens design.</text></svg>