<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" role="img" aria-labelledby="t d"><title id="t">Subjective refraction sequence</title><desc id="d">A structured flow from history and visual acuity through sphere, cylinder, binocular balance and final verification.</desc><rect width="960" height="650" rx="24" fill="#f8fafc"/><text x="480" y="48" text-anchor="middle" font-family="Arial" font-size="30" font-weight="700" fill="#17324d">SUBJECTIVE REFRACTION: CLINICAL SEQUENCE</text><g font-family="Arial" font-size="21" text-anchor="middle" fill="#17324d" stroke="#4b7188" stroke-width="2"><rect x="300" y="82" width="360" height="62" rx="14" fill="#eaf4ff"/><text x="480" y="120" stroke="none">History + presenting visual acuity</text><path d="M480 144V174" fill="none"/><path d="M470 164L480 176L490 164" fill="none"/><rect x="300" y="180" width="360" height="62" rx="14" fill="#eaf4ff"/><text x="480" y="218" stroke="none">Objective starting point</text><path d="M480 242V272" fill="none"/><path d="M470 262L480 274L490 262" fill="none"/><rect x="300" y="278" width="360" height="62" rx="14" fill="#e8f5ef"/><text x="480" y="316" stroke="none">Sphere refinement</text><path d="M480 340V370" fill="none"/><path d="M470 360L480 372L490 360" fill="none"/><rect x="300" y="376" width="360" height="62" rx="14" fill="#e8f5ef"/><text x="480" y="414" stroke="none">Cylinder axis + power (if indicated)</text><path d="M480 438V468" fill="none"/><path d="M470 458L480 470L490 458" fill="none"/><rect x="300" y="474" width="360" height="62" rx="14" fill="#fff4e8"/><text x="480" y="512" stroke="none">Binocular balance (when appropriate)</text><path d="M480 536V566" fill="none"/><path d="M470 556L480 568L490 556" fill="none"/><rect x="300" y="572" width="360" height="55" rx="14" fill="#dceafe"/><text x="480" y="606" stroke="none">Verify acuity, comfort + prescription</text></g><text x="705" y="309" font-family="Arial" font-size="17" fill="#9a4d20">JCC may assist</text><text x="705" y="332" font-family="Arial" font-size="17" fill="#9a4d20">cylinder refinement</text></svg>