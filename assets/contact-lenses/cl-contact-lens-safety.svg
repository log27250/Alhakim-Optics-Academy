<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-labelledby="t d"><title id="t">Contact lens safety habits</title><desc id="d">Key contact lens safety habits: clean dry hands, no tap water, follow replacement and disinfection instructions, avoid sleeping in lenses unless specifically prescribed.</desc><rect width="800" height="430" fill="#fff"/><text x="35" y="45" font-family="Arial" font-size="25" fill="#17324d">Contact lens safety essentials</text><g font-family="Arial" font-size="20" fill="#17324d"><rect x="55" y="100" width="320" height="105" rx="12" fill="#eaf4fa" stroke="#28627f" stroke-width="3"/><text x="80" y="140">1. Wash and dry hands</text><text x="80" y="172">before handling lenses.</text><rect x="425" y="100" width="320" height="105" rx="12" fill="#fff2e6" stroke="#b77b16" stroke-width="3"/><text x="450" y="140">2. Keep lenses away</text><text x="450" y="172">from tap water.</text><rect x="55" y="240" width="320" height="105" rx="12" fill="#edf5e9" stroke="#54834b" stroke-width="3"/><text x="80" y="280">3. Follow replacement</text><text x="80" y="312">and disinfection schedules.</text><rect x="425" y="240" width="320" height="105" rx="12" fill="#f3eafa" stroke="#79539b" stroke-width="3"/><text x="450" y="280">4. Do not sleep or swim</text><text x="450" y="312">in lenses unless advised.</text></g><text x="55" y="390" font-family="Arial" font-size="17" fill="#8b1e2d">Pain, marked redness, photophobia or reduced vision: remove lenses and seek prompt eye assessment.</text></svg>