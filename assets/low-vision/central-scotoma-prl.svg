<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#f3f7fb"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Central Scotoma and Preferred Retinal Locus</text><g font-family="Arial" text-anchor="middle"><g transform="translate(300 265)"><circle r="130" fill="#e5f0f6" stroke="#315b78" stroke-width="4"/><circle r="75" fill="#263b50" opacity=".9"/><circle r="13" fill="#fff"/><text y="175" font-size="23" fill="#17324d">Central scotoma</text><text y="205" font-size="18" fill="#456">Central detail is obscured</text></g><g transform="translate(800 265)"><circle r="130" fill="#e5f0f6" stroke="#315b78" stroke-width="4"/><circle r="75" fill="#263b50" opacity=".9"/><circle cx="95" cy="-70" r="17" fill="#e6b94e" stroke="#8d6b23" stroke-width="4"/><path d="M0 0L95 -70" stroke="#2a7898" stroke-width="4" stroke-dasharray="8 7"/><text y="175" font-size="23" fill="#17324d">Eccentric viewing / PRL</text><text y="205" font-size="18" fill="#456">Uses a trained off-centre retinal area</text></g></g><text x="550" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#345">Schematic concept only; the preferred retinal locus varies between individuals.</text></svg>