<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">Low vision clinical case workflow</title><desc id="d">Structured clinical case analysis from presenting complaint through outcomes.</desc><rect width="1000" height="650" rx="28" fill="#f5f8fb"/><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">CLINICAL CASE ANALYSIS</text><g font-family="Arial" text-anchor="middle" font-size="22" font-weight="bold"><rect x="300" y="95" width="400" height="68" rx="14" fill="#dceeff" stroke="#3478a8" stroke-width="3"/><text x="500" y="138" fill="#17324d">1. Presenting complaint and goals</text><rect x="300" y="195" width="400" height="68" rx="14" fill="#e2f3e9" stroke="#38865c" stroke-width="3"/><text x="500" y="238" fill="#174b31">2. Urgency and ocular health screen</text><rect x="300" y="295" width="400" height="68" rx="14" fill="#fff0dc" stroke="#bb7a2d" stroke-width="3"/><text x="500" y="338" fill="#704313">3. Visual and functional assessment</text><rect x="300" y="395" width="400" height="68" rx="14" fill="#eee8fb" stroke="#7956a6" stroke-width="3"/><text x="500" y="438" fill="#49316b">4. Trial and train interventions</text><rect x="300" y="495" width="400" height="68" rx="14" fill="#e5edf2" stroke="#536b80" stroke-width="3"/><text x="500" y="538" fill="#17324d">5. Measure outcomes and follow up</text></g><g stroke="#536b80" stroke-width="5" fill="none"><path d="M500 163 V193 M500 263 V293 M500 363 V393 M500 463 V493"/><path d="M488 183 l12 12 12 -12 M488 283 l12 12 12 -12 M488 383 l12 12 12 -12 M488 483 l12 12 12 -12"/></g></svg>