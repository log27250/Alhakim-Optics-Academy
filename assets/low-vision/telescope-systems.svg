<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#f3f7fb"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Telescope Systems for Distance Tasks</text><g font-family="Arial" text-anchor="middle"><g transform="translate(120 140)"><text x="200" y="25" font-size="28" font-weight="bold" fill="#17324d">Galilean</text><path d="M50 125L350 90L350 180L50 145Z" fill="#d8eaf4" stroke="#315b78" stroke-width="5"/><path d="M110 90V180M300 90V180" stroke="#315b78" stroke-width="8"/><path d="M15 135H50M350 135H400" stroke="#2a7898" stroke-width="5"/><text x="200" y="245" font-size="20" fill="#456">Positive objective + negative eyepiece</text></g><g transform="translate(610 140)"><text x="200" y="25" font-size="28" font-weight="bold" fill="#17324d">Keplerian</text><path d="M50 125L350 90L350 180L50 145Z" fill="#d8eaf4" stroke="#315b78" stroke-width="5"/><path d="M110 90V180M300 90V180" stroke="#315b78" stroke-width="8"/><path d="M15 135H50M350 135H400" stroke="#2a7898" stroke-width="5"/><text x="200" y="245" font-size="20" fill="#456">Positive objective + positive eyepiece</text></g></g><text x="550" y="470" text-anchor="middle" font-family="Arial" font-size="21" fill="#345">Telescope selection requires task-specific training and assessment of field-of-view limitations.</text></svg>