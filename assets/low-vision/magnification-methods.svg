<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#f3f7fb"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Four Magnification Strategies</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#6d9bb8" stroke-width="3"><rect x="45" y="130" width="245" height="300" rx="16"/><rect x="315" y="130" width="245" height="300" rx="16"/><rect x="585" y="130" width="245" height="300" rx="16"/><rect x="855" y="130" width="200" height="300" rx="16"/></g><g fill="#17324d" font-size="23" font-weight="bold"><text x="167" y="185">Relative Size</text><text x="437" y="185">Relative Distance</text><text x="707" y="185">Angular</text><text x="955" y="185">Electronic</text></g><g fill="#315b78"><rect x="95" y="235" width="145" height="45" rx="5"/><rect x="95" y="305" width="145" height="75" rx="5"/><path d="M365 270h145M380 250l-15 20 15 20M495 250l15 20-15 20" fill="none" stroke="#315b78" stroke-width="7"/><circle cx="707" cy="290" r="65" fill="#dcecf5" stroke="#315b78" stroke-width="10"/><path d="M750 335l55 55" stroke="#315b78" stroke-width="15" stroke-linecap="round"/><rect x="890" y="230" width="130" height="95" rx="8" fill="#dcecf5" stroke="#315b78" stroke-width="8"/><text x="955" y="290" font-size="38" fill="#17324d">Aa</text></g><g fill="#456" font-size="17"><text x="167" y="405">Larger target</text><text x="437" y="405">Closer viewing</text><text x="707" y="405">Optical lens</text><text x="955" y="405">Camera + display</text></g></g><text x="550" y="500" text-anchor="middle" font-family="Arial" font-size="21" fill="#345">Each strategy has trade-offs in field of view, working distance and usability.</text></svg>