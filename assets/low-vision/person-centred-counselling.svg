<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">Person-centred counselling pathway</title><desc id="d">Listen, explain accessibly, agree goals, choose options together, use teach-back and follow up.</desc><rect width="1000" height="600" rx="28" fill="#f5f8fb"/><text x="500" y="60" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">PERSON-CENTRED COUNSELLING</text><g font-family="Arial" text-anchor="middle" font-weight="bold"><rect x="90" y="125" width="360" height="110" rx="18" fill="#dceeff" stroke="#3478a8" stroke-width="4"/><text x="270" y="170" font-size="27" fill="#17324d">1. LISTEN</text><text x="270" y="205" font-size="21" fill="#17324d">Concerns, priorities, preferences</text><rect x="550" y="125" width="360" height="110" rx="18" fill="#e2f3e9" stroke="#38865c" stroke-width="4"/><text x="730" y="170" font-size="27" fill="#174b31">2. EXPLAIN</text><text x="730" y="205" font-size="21" fill="#174b31">Clear, accessible information</text><rect x="550" y="315" width="360" height="110" rx="18" fill="#fff0dc" stroke="#bb7a2d" stroke-width="4"/><text x="730" y="360" font-size="27" fill="#704313">3. AGREE GOALS</text><text x="730" y="395" font-size="21" fill="#704313">Shared decisions and options</text><rect x="90" y="315" width="360" height="110" rx="18" fill="#eee8fb" stroke="#7956a6" stroke-width="4"/><text x="270" y="360" font-size="27" fill="#49316b">4. CHECK UNDERSTANDING</text><text x="270" y="395" font-size="21" fill="#49316b">Teach-back, not testing</text><rect x="320" y="485" width="360" height="75" rx="18" fill="#17324d"/><text x="500" y="532" font-size="27" fill="white">5. PLAN &amp; FOLLOW UP</text></g><g stroke="#536b80" stroke-width="6" fill="none" stroke-linecap="round"><path d="M450 180 H540 M730 235 V305 M550 370 H460 M270 425 V475 M320 522 H285"/><path d="M520 168 l20 12 -20 12 M718 285 l12 20 12 -20 M480 358 l-20 12 20 12 M258 455 l12 20 12 -20"/></g></svg>