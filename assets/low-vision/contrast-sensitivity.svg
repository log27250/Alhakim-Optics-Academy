<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560"><rect width="1100" height="560" rx="24" fill="#f3f7fb"/><text x="550" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Contrast Sensitivity: Same Target, Different Contrast</text><g font-family="Arial" text-anchor="middle"><g><rect x="85" y="130" width="280" height="260" rx="15" fill="#fff" stroke="#9bb6c9" stroke-width="2"/><rect x="410" y="130" width="280" height="260" rx="15" fill="#fff" stroke="#9bb6c9" stroke-width="2"/><rect x="735" y="130" width="280" height="260" rx="15" fill="#fff" stroke="#9bb6c9" stroke-width="2"/></g><g font-size="38"><text x="225" y="260" fill="#111">E</text><text x="550" y="260" fill="#888">E</text><text x="875" y="260" fill="#c8c8c8">E</text></g><g font-size="25" fill="#345"><text x="225" y="345">High contrast</text><text x="550" y="345">Medium contrast</text><text x="875" y="345">Low contrast</text></g></g><text x="550" y="475" text-anchor="middle" font-family="Arial" font-size="22" fill="#345">Reduced contrast sensitivity can impair object detection despite relatively good acuity.</text></svg>