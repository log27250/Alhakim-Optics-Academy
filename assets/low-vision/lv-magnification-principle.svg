<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" role="img" aria-labelledby="t d"><title id="t">Low vision magnification principles</title><desc id="d">A magnifier enlarges the apparent angular size of print; working distance and illumination affect usability.</desc><rect width="800" height="420" fill="#fff"/><text x="35" y="45" font-family="Arial" font-size="25" fill="#17324d">Low-vision magnification: practical factors</text><rect x="70" y="130" width="210" height="125" rx="8" fill="#f4f4f4" stroke="#777" stroke-width="3"/><g stroke="#333" stroke-width="5"><path d="M105 165 H245 M105 195 H245 M105 225 H220"/></g><circle cx="420" cy="190" r="80" fill="#dceefa" fill-opacity=".7" stroke="#28627f" stroke-width="8"/><path d="M478 248 L555 325" stroke="#28627f" stroke-width="18" stroke-linecap="round"/><text x="420" y="195" text-anchor="middle" font-family="Arial" font-size="26" fill="#17324d">LARGER</text><path d="M290 190 H325 M310 178 L328 190 L310 202" stroke="#d28a00" stroke-width="5" fill="none"/><g font-family="Arial" font-size="19" fill="#17324d"><text x="585" y="145">Consider:</text><text x="585" y="185">• Magnification</text><text x="585" y="220">• Working distance</text><text x="585" y="255">• Illumination</text><text x="585" y="290">• Contrast / glare</text></g><text x="55" y="375" font-family="Arial" font-size="18" fill="#555">Device choice should be based on the person's real task and observed performance.</text></svg>