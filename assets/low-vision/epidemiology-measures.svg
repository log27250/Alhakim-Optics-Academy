<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Epidemiological measures</title><desc id="d">Prevalence, incidence and burden concepts.</desc><rect width="1000" height="520" rx="28" fill="#f4f8fc"/><text x="500" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">EPIDEMIOLOGY OF VISUAL IMPAIRMENT</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="130" width="270" height="250" rx="22" fill="#dceeff" stroke="#3478a8" stroke-width="4"/><text x="190" y="190" font-size="30" font-weight="bold" fill="#17324d">PREVALENCE</text><text x="190" y="245" font-size="23" fill="#17324d">All existing cases</text><text x="190" y="285" font-size="20" fill="#17324d">in a population</text><text x="190" y="325" font-size="20" fill="#17324d">at a given time</text><rect x="365" y="130" width="270" height="250" rx="22" fill="#e2f3e9" stroke="#38865c" stroke-width="4"/><text x="500" y="190" font-size="30" font-weight="bold" fill="#174b31">INCIDENCE</text><text x="500" y="245" font-size="23" fill="#174b31">New cases</text><text x="500" y="285" font-size="20" fill="#174b31">arising over</text><text x="500" y="325" font-size="20" fill="#174b31">a defined period</text><rect x="675" y="130" width="270" height="250" rx="22" fill="#fff0dc" stroke="#bb7a2d" stroke-width="4"/><text x="810" y="190" font-size="30" font-weight="bold" fill="#704313">BURDEN</text><text x="810" y="245" font-size="23" fill="#704313">Health impact</text><text x="810" y="285" font-size="20" fill="#704313">social, educational</text><text x="810" y="325" font-size="20" fill="#704313">and economic effects</text></g><text x="500" y="455" text-anchor="middle" font-family="Arial" font-size="21" fill="#42566a">Different measures answer different public-health questions.</text></svg>