<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="t d"><title id="t">Evidence-based rehabilitation cycle</title><desc id="d">A continuous cycle integrating research, clinical expertise and patient goals.</desc><rect width="1000" height="560" rx="28" fill="#f5f8fb"/><text x="500" y="65" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">EVIDENCE-BASED PRACTICE</text><g font-family="Arial" text-anchor="middle"><rect x="350" y="115" width="300" height="100" rx="18" fill="#dceeff" stroke="#3478a8" stroke-width="4"/><text x="500" y="155" font-size="24" font-weight="bold" fill="#17324d">Best available</text><text x="500" y="187" font-size="24" fill="#17324d">research evidence</text><rect x="70" y="315" width="330" height="105" rx="18" fill="#e2f3e9" stroke="#38865c" stroke-width="4"/><text x="235" y="355" font-size="24" font-weight="bold" fill="#174b31">Clinical expertise</text><text x="235" y="388" font-size="21" fill="#174b31">skills and judgement</text><rect x="600" y="315" width="330" height="105" rx="18" fill="#fff0dc" stroke="#bb7a2d" stroke-width="4"/><text x="765" y="355" font-size="24" font-weight="bold" fill="#704313">Patient values</text><text x="765" y="388" font-size="21" fill="#704313">goals and context</text><path d="M390 220 L270 305 M610 220 L730 305 M400 370 L600 370" stroke="#536b80" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M260 294 l10 20 20 -8 M720 294 l-10 20 -20 -8 M580 355 l20 15 -20 15" stroke="#536b80" stroke-width="7" fill="none"/><rect x="315" y="465" width="370" height="60" rx="16" fill="#17324d"/><text x="500" y="504" font-size="24" font-weight="bold" fill="white">Individualised decisions</text></g></svg>