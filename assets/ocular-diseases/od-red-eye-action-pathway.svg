<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t d"><title id="t">Red eye triage pathway</title><desc id="d">Urgency pathway emphasizing reduced vision, pain, photophobia, corneal opacity, contact lens risk, chemical injury and open globe.</desc><rect width="800" height="440" fill="#fff"/><text x="35" y="42" font-family="Arial" font-size="25" fill="#17324d">Red eye: safety-first triage</text><rect x="240" y="75" width="320" height="70" rx="12" fill="#eaf2f8" stroke="#28627f" stroke-width="3"/><text x="400" y="118" text-anchor="middle" font-family="Arial" font-size="22" fill="#17324d">Red eye presentation</text><path d="M400 145 V185 M400 185 H200 V220 M400 185 H600 V220" stroke="#555" stroke-width="4" fill="none"/><rect x="45" y="220" width="310" height="120" rx="12" fill="#fde9e8" stroke="#b23a48" stroke-width="3"/><text x="200" y="255" text-anchor="middle" font-family="Arial" font-size="20" fill="#8b1e2d">Any red flag?</text><text x="200" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#333">Reduced vision, pain, photophobia,</text><text x="200" y="310" text-anchor="middle" font-family="Arial" font-size="17" fill="#333">corneal opacity, contact lens risk</text><rect x="445" y="220" width="310" height="120" rx="12" fill="#edf5e9" stroke="#54834b" stroke-width="3"/><text x="600" y="255" text-anchor="middle" font-family="Arial" font-size="20" fill="#285b2c">No red flags identified</text><text x="600" y="285" text-anchor="middle" font-family="Arial" font-size="17" fill="#333">Complete focused assessment</text><text x="600" y="310" text-anchor="middle" font-family="Arial" font-size="17" fill="#333">and safety-net advice</text><text x="200" y="375" text-anchor="middle" font-family="Arial" font-size="18" fill="#8b1e2d">Urgent / emergency referral</text><text x="600" y="375" text-anchor="middle" font-family="Arial" font-size="18" fill="#285b2c">Manage according to findings</text><text x="45" y="420" font-family="Arial" font-size="16" fill="#555">Chemical injury: irrigate immediately. Suspected open globe: shield without pressure and refer emergently.</text></svg>