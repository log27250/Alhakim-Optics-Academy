<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Red Eye: Triage Red Flags</title><desc id="d">A sign requiring history and examination; identify urgent features</desc><rect width="1000" height="620" rx="26" fill="#f4f8fb"/><text x="500" y="54" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#173b57">Red Eye: Triage Red Flags</text><text x="500" y="88" text-anchor="middle" font-family="Arial" font-size="17" fill="#45657b">A sign requiring history and examination; identify urgent features</text><rect x="100" y="145" width="800" height="350" rx="20" fill="#fff" stroke="#d6e0e8" stroke-width="3"/><g font-family="Arial" font-size="22" fill="#173b57"><text x="145" y="205">• Reduced or sudden loss of vision</text><text x="145" y="260">• Moderate/severe pain or photophobia</text><text x="145" y="315">• Corneal opacity or contact lens wearer with pain</text><text x="145" y="370">• Abnormal pupil, halos, headache or nausea</text><text x="145" y="425">• Trauma, chemical exposure or recent surgery</text></g><rect x="300" y="520" width="400" height="45" rx="12" fill="#f8d9d9" stroke="#c74b4b" stroke-width="2"/><text x="500" y="550" text-anchor="middle" font-size="20" fill="#8f2929">Urgent assessment / referral when indicated</text><text x="500" y="590" text-anchor="middle" font-family="Arial" font-size="14" fill="#61798b">HAKIM OPTICS ACADEMY · EDUCATIONAL SCHEMATIC</text></svg>