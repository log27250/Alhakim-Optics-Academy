<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Orthoptic exercise categories</title><desc id="d">Examples of vergence, accommodation, fixation and oculomotor training with diagnosis-led selection.</desc><rect width="900" height="470" rx="24" fill="#f7f9fc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">ORTHOPTIC EXERCISE CATEGORIES</text><g font-family="Arial" text-anchor="middle"><g stroke-width="3"><rect x="55" y="105" width="365" height="125" rx="18" fill="#e1efff" stroke="#3976a8"/><rect x="480" y="105" width="365" height="125" rx="18" fill="#e6f5ed" stroke="#36835e"/><rect x="55" y="265" width="365" height="125" rx="18" fill="#fff0dc" stroke="#b47b2c"/><rect x="480" y="265" width="365" height="125" rx="18" fill="#f0eaff" stroke="#7756a8"/></g><g fill="#17324d" font-size="23" font-weight="bold"><text x="237" y="145">VERGENCE</text><text x="662" y="145">ACCOMMODATION</text><text x="237" y="305">FIXATION</text><text x="662" y="305">OCULOMOTOR</text></g><g fill="#34495e" font-size="17"><text x="237" y="180">Convergence / divergence</text><text x="237" y="205">Prism or stereoscopic targets</text><text x="662" y="180">Lens flippers / near targets</text><text x="662" y="205">Facility and response flexibility</text><text x="237" y="340">Accuracy and stability</text><text x="237" y="365">Only when a deficit is documented</text><text x="662" y="340">Pursuits and saccades</text><text x="662" y="365">Targeted, not universal reading cure</text></g></g><rect x="145" y="415" width="610" height="38" rx="12" fill="#17324d"/><text x="450" y="441" fill="white" font-family="Arial" font-size="18" text-anchor="middle">Select by diagnosis • progress gradually • measure outcomes</text></svg>