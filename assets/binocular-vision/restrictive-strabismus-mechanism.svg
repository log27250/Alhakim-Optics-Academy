<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="28" fill="#f5f8fc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Restrictive Strabismus: Mechanical Limitation</text><g font-family="Arial" text-anchor="middle"><rect x="65" y="125" width="410" height="300" rx="22" fill="#fff" stroke="#3985b8" stroke-width="4"/><rect x="525" y="125" width="410" height="300" rx="22" fill="#fff" stroke="#c77955" stroke-width="4"/><text x="270" y="175" font-size="28" font-weight="bold" fill="#245d83">Normal movement</text><text x="730" y="175" font-size="28" font-weight="bold" fill="#a45337">Restricted movement</text><circle cx="270" cy="270" r="65" fill="#e5f1f8" stroke="#3985b8" stroke-width="6"/><path d="M270 205 V145 M270 145 l-15 20 M270 145 l15 20" stroke="#3985b8" stroke-width="6" fill="none"/><circle cx="730" cy="270" r="65" fill="#f9e8e1" stroke="#c77955" stroke-width="6"/><path d="M730 205 V160 M730 160 l-15 20 M730 160 l15 20" stroke="#c77955" stroke-width="6" fill="none"/><path d="M675 145 Q730 110 785 145" stroke="#c77955" stroke-width="10" fill="none"/><text x="270" y="375" font-size="22" fill="#17324d">Unrestricted excursion</text><text x="730" y="375" font-size="22" fill="#17324d">Fibrosis / entrapment</text><text x="500" y="485" font-size="22" fill="#17324d">Examples: thyroid eye disease, orbital fracture, postoperative scarring.</text><text x="500" y="520" font-size="19" fill="#526b7d">Specialist assessment may include imaging and forced-duction testing.</text></g></svg>