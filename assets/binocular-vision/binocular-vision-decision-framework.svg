<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-labelledby="t d"><title id="t">Binocular vision clinical decision framework</title><desc id="d">Integrate symptoms, examination domains, red flags, diagnosis, evidence-informed management and measurable follow-up.</desc><rect width="900" height="480" rx="24" fill="#f7f9fc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">CLINICAL DECISION-MAKING FRAMEWORK</text><g font-family="Arial" text-anchor="middle"><rect x="290" y="75" width="320" height="60" rx="14" fill="#e3efff" stroke="#3976a8" stroke-width="3"/><text x="450" y="112" font-size="21" font-weight="bold" fill="#17324d">Symptoms + patient goals</text><path d="M450 135V158m-10 -10 10 10 10 -10" stroke="#3976a8" stroke-width="3" fill="none"/><rect x="90" y="165" width="720" height="110" rx="16" fill="#e8f5ee" stroke="#36835e" stroke-width="3"/><text x="450" y="198" font-size="21" font-weight="bold" fill="#17324d">Integrate examination findings</text><g fill="#34495e" font-size="17"><text x="210" y="235">Acuity / refraction</text><text x="390" y="235">Alignment / motility</text><text x="580" y="235">Sensory / vergence</text><text x="735" y="235">Ocular health</text></g><path d="M450 275V300m-10 -10 10 10 10 -10" stroke="#3976a8" stroke-width="3" fill="none"/><rect x="290" y="305" width="320" height="58" rx="14" fill="#fff0dc" stroke="#b47b2c" stroke-width="3"/><text x="450" y="341" font-size="20" font-weight="bold" fill="#17324d">Differential + red flags</text><path d="M450 363V388m-10 -10 10 10 10 -10" stroke="#3976a8" stroke-width="3" fill="none"/><rect x="90" y="393" width="720" height="62" rx="14" fill="#eee9fb" stroke="#7756a8" stroke-width="3"/><text x="450" y="420" font-size="19" font-weight="bold" fill="#17324d">Evidence-informed management → measurable follow-up</text><text x="450" y="443" font-size="14" fill="#34495e">Optical correction • observation • targeted therapy • prism • referral when indicated</text></g></svg>