<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f5f8fc"/><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Diplopia and Visual Confusion</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="115" width="420" height="330" rx="22" fill="#fff" stroke="#3985b8" stroke-width="4"/><text x="265" y="165" font-size="27" font-weight="bold" fill="#245d83">Diplopia</text><circle cx="170" cy="235" r="28" fill="#f0c44d"/><circle cx="360" cy="235" r="28" fill="#f0c44d"/><path d="M170 270 L170 335 M360 270 L360 335" stroke="#245d83" stroke-width="5"/><text x="265" y="380" font-size="22" fill="#17324d">One object perceived as</text><text x="265" y="412" font-size="22" fill="#17324d">two separate images</text><rect x="525" y="115" width="420" height="330" rx="22" fill="#fff" stroke="#9a6ab5" stroke-width="4"/><text x="735" y="165" font-size="27" font-weight="bold" fill="#71468d">Visual confusion</text><circle cx="660" cy="235" r="28" fill="#e88c63"/><circle cx="810" cy="235" r="28" fill="#65b7a5"/><path d="M660 270 L735 335 M810 270 L735 335" stroke="#71468d" stroke-width="5"/><text x="735" y="380" font-size="22" fill="#17324d">Different objects perceived</text><text x="735" y="412" font-size="22" fill="#17324d">in the same visual direction</text></g></svg>