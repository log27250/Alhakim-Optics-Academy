<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="28" fill="#f5f8fc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Paralytic Strabismus: Cranial Nerve Patterns</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#3985b8" stroke-width="4"><rect x="55" y="125" width="280" height="300" rx="20"/><rect x="360" y="125" width="280" height="300" rx="20"/><rect x="665" y="125" width="280" height="300" rx="20"/></g><g fill="#245d83" font-size="27" font-weight="bold"><text x="195" y="180">CN III</text><text x="500" y="180">CN IV</text><text x="805" y="180">CN VI</text></g><g fill="#17324d" font-size="21"><text x="195" y="235">Ptosis may occur</text><text x="195" y="275">Multiple movement</text><text x="195" y="305">limitations</text><text x="500" y="235">Vertical / torsional</text><text x="500" y="275">diplopia; worse in</text><text x="500" y="305">downgaze</text><text x="805" y="235">Abduction weakness</text><text x="805" y="275">Esotropia; often worse</text><text x="805" y="305">at distance</text></g><g stroke="#c77955" stroke-width="7" fill="none"><path d="M130 355 H260"/><path d="M435 355 L565 355"/><path d="M740 355 H870"/></g><text x="500" y="480" font-size="22" fill="#17324d">Check pupils, eyelids, ductions, versions and neurological signs.</text><text x="500" y="515" font-size="19" fill="#a45337">Acute pupil-involving CN III palsy or neurological signs are emergencies.</text></g></svg>