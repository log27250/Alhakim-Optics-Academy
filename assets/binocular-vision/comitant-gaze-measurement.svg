<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="28" fill="#f5f8fc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Comitant Strabismus: Compare Gaze Positions</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#3985b8" stroke-width="4"><rect x="70" y="130" width="250" height="280" rx="20"/><rect x="375" y="130" width="250" height="280" rx="20"/><rect x="680" y="130" width="250" height="280" rx="20"/></g><g fill="#245d83" font-size="25" font-weight="bold"><text x="195" y="180">Left gaze</text><text x="500" y="180">Primary</text><text x="805" y="180">Right gaze</text></g><g fill="none" stroke="#3985b8" stroke-width="6"><circle cx="170" cy="250" r="34"/><circle cx="220" cy="250" r="34"/><circle cx="475" cy="250" r="34"/><circle cx="525" cy="250" r="34"/><circle cx="780" cy="250" r="34"/><circle cx="830" cy="250" r="34"/></g><g fill="#17324d" font-size="22"><text x="195" y="330">Similar angle</text><text x="500" y="330">Similar angle</text><text x="805" y="330">Similar angle</text></g><text x="500" y="475" font-size="23" fill="#17324d">Comitance describes relatively stable deviation across gaze positions.</text><text x="500" y="510" font-size="19" fill="#526b7d">It does not by itself prove that the cause is benign.</text></g></svg>