<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440"><rect width="900" height="440" rx="24" fill="#f7f9fc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17365d">Accommodative Insufficiency</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="105" width="230" height="230" rx="18" fill="#e4efff" stroke="#4776b8" stroke-width="3"/><text x="185" y="150" font-size="22" fill="#17365d">Near demand</text><text x="185" y="205" font-size="18" fill="#17365d">Clear target</text><path d="M150 235 L220 235 M185 200 L185 270" stroke="#315b91" stroke-width="5"/><rect x="335" y="105" width="230" height="230" rx="18" fill="#fff0dc" stroke="#c27a24" stroke-width="3"/><text x="450" y="150" font-size="22" fill="#75420b">Reduced ability</text><text x="450" y="195" font-size="18" fill="#75420b">to increase</text><text x="450" y="225" font-size="18" fill="#75420b">accommodative</text><text x="450" y="255" font-size="18" fill="#75420b">power</text><rect x="600" y="105" width="230" height="230" rx="18" fill="#ffe8e8" stroke="#bd5555" stroke-width="3"/><text x="715" y="150" font-size="22" fill="#8d2929">Possible effects</text><text x="715" y="205" font-size="18" fill="#8d2929">Near blur</text><text x="715" y="235" font-size="18" fill="#8d2929">Reading fatigue</text><text x="715" y="265" font-size="18" fill="#8d2929">Frontal headache</text></g><text x="450" y="390" text-anchor="middle" font-family="Arial" font-size="17" fill="#34445b">Assess amplitude, response and facility separately; check refraction and vergence</text></svg>