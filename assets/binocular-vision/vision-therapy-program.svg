<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d"><title id="t">Vision therapy programme cycle</title><desc id="d">Diagnosis, baseline assessment, individualized training, monitoring and reassessment.</desc><rect width="900" height="430" rx="24" fill="#f4f8fc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">VISION THERAPY: CLINICAL CYCLE</text><g font-family="Arial" text-anchor="middle"><g fill="#dcecff" stroke="#3976a8" stroke-width="3"><rect x="45" y="115" width="230" height="95" rx="16"/><rect x="335" y="115" width="230" height="95" rx="16"/><rect x="625" y="115" width="230" height="95" rx="16"/><rect x="335" y="285" width="230" height="95" rx="16"/></g><g font-size="22" font-weight="bold" fill="#17324d"><text x="160" y="153">1. Diagnose</text><text x="160" y="183" font-size="16">Defined functional deficit</text><text x="450" y="153">2. Baseline</text><text x="450" y="183" font-size="16">Symptoms + objective tests</text><text x="740" y="153">3. Individualize</text><text x="740" y="183" font-size="16">Goal-linked procedures</text><text x="450" y="323">4. Monitor</text><text x="450" y="353" font-size="16">Progress, safety, outcomes</text></g><g stroke="#3976a8" stroke-width="5" fill="none"><path d="M275 162H325m-12 -10 12 10-12 10M565 162H615m-12 -10 12 10-12 10M740 210V250H450V275m-10 -12 10 12 10 -12"/></g><path d="M335 332H160V225" fill="none" stroke="#3976a8" stroke-width="4" stroke-dasharray="9 7"/><path d="M150 237l10 -12 10 12" fill="none" stroke="#3976a8" stroke-width="4"/><text x="450" y="412" font-family="Arial" font-size="15" text-anchor="middle" fill="#52677b">Reassess diagnosis and modify or stop if outcomes or safety require it</text></g></svg>