<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="t d"><title id="t">Prism optical effect and prescribing</title><desc id="d">Incident parallel rays are deviated toward the prism base; the apparent image is displaced toward the apex.</desc><rect width="900" height="460" rx="24" fill="#f8fafc"/><text x="450" y="48" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">PRISM: LIGHT DEVIATION</text><g stroke-width="4" fill="none"><path d="M90 155H340" stroke="#d18a21"/><path d="M90 220H340" stroke="#d18a21"/><path d="M90 285H340" stroke="#d18a21"/><path d="M90 155l-13 -8m13 8-13 8M90 220l-13 -8m13 8-13 8M90 285l-13 -8m13 8-13 8" stroke="#d18a21"/><path d="M340 115L535 220L340 325Z" fill="#d9efff" stroke="#3976a8"/><path d="M535 220L760 110M535 220L760 175M535 220L760 240" stroke="#2583b8"/><path d="M760 110l-15 2m15 -2-6 13M760 175l-15 2m15 -2-6 13M760 240l-15 2m15 -2-6 13" stroke="#2583b8"/></g><g font-family="Arial" fill="#17324d"><text x="175" y="115" font-size="20">Incident rays</text><text x="330" y="365" font-size="19">Apex</text><text x="510" y="365" font-size="19">Base</text><text x="675" y="285" font-size="19">Emergent rays</text><text x="450" y="410" font-size="19" text-anchor="middle" font-weight="bold">Light bends toward the base; apparent image shifts toward the apex</text></g><rect x="85" y="425" width="730" height="24" rx="8" fill="#e7eef5"/><text x="450" y="443" font-family="Arial" font-size="14" text-anchor="middle" fill="#34495e">Clinical prescription requires measured deviation, direction, stability and symptom response</text></svg>