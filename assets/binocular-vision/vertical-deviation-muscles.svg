<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560"><rect width="1000" height="560" rx="28" fill="#f5f8fc"/><text x="500" y="55" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Vertical Deviation: Extraocular Muscle Actions</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#3985b8" stroke-width="4"><rect x="70" y="125" width="390" height="145" rx="20"/><rect x="540" y="125" width="390" height="145" rx="20"/><rect x="70" y="305" width="390" height="145" rx="20"/><rect x="540" y="305" width="390" height="145" rx="20"/></g><g font-size="27" font-weight="bold" fill="#245d83"><text x="265" y="175">Superior rectus</text><text x="735" y="175">Inferior rectus</text><text x="265" y="355">Superior oblique</text><text x="735" y="355">Inferior oblique</text></g><g font-size="21" fill="#17324d"><text x="265" y="220">Elevates • adducts • intorts</text><text x="735" y="220">Depresses • adducts • extorts</text><text x="265" y="400">Intorts • depresses in adduction</text><text x="735" y="400">Extorts • elevates in adduction</text></g><text x="500" y="505" font-size="20" fill="#526b7d">Muscle actions vary with eye position; interpret vertical deviations in diagnostic gaze.</text></g></svg>