<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f5f8fc"/><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Intermittent Exotropia: Control Assessment</text><g font-family="Arial" text-anchor="middle"><rect x="55" y="125" width="270" height="290" rx="22" fill="#fff" stroke="#3985b8" stroke-width="4"/><rect x="365" y="125" width="270" height="290" rx="22" fill="#fff" stroke="#d39a45" stroke-width="4"/><rect x="675" y="125" width="270" height="290" rx="22" fill="#fff" stroke="#5a9b83" stroke-width="4"/><g font-size="27" font-weight="bold"><text x="190" y="180" fill="#245d83">Good control</text><text x="500" y="180" fill="#a36c1f">Reduced control</text><text x="810" y="180" fill="#39765f">Poor control</text></g><g fill="#17324d" font-size="21"><text x="190" y="245">Rapid recovery</text><text x="190" y="280">after dissociation</text><text x="500" y="245">Delayed recovery</text><text x="500" y="280">or frequent breaks</text><text x="810" y="245">Manifest deviation</text><text x="810" y="280">often / sustained</text></g><g stroke-width="8" fill="none"><path d="M125 330 H255" stroke="#3985b8"/><path d="M435 330 H565" stroke="#d39a45"/><path d="M745 330 H875" stroke="#5a9b83"/></g><text x="500" y="470" font-size="22" fill="#17324d">Monitor frequency, recovery, symptoms and stereoacuity—not angle alone.</text></g></svg>