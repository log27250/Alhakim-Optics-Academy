<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><rect width="1000" height="520" rx="28" fill="#f5f8fc"/><text x="500" y="58" text-anchor="middle" font-family="Arial" font-size="34" font-weight="bold" fill="#17324d">Accommodative Esotropia: Mechanism</text><g font-family="Arial" text-anchor="middle"><g fill="#fff" stroke="#3985b8" stroke-width="4"><rect x="45" y="190" width="190" height="120" rx="18"/><rect x="285" y="190" width="190" height="120" rx="18"/><rect x="525" y="190" width="190" height="120" rx="18"/><rect x="765" y="190" width="190" height="120" rx="18"/></g><g fill="#245d83" font-size="24" font-weight="bold"><text x="140" y="240">Hyperopia</text><text x="380" y="240">Increased</text><text x="380" y="273">accommodation</text><text x="620" y="240">Increased</text><text x="620" y="273">accommodative</text><text x="620" y="300">convergence</text><text x="860" y="240">Esodeviation</text></g><g stroke="#c77955" stroke-width="6" fill="none"><path d="M235 250 H280 M475 250 H520 M715 250 H760"/></g><g fill="#c77955"><path d="M270 238 L285 250 L270 262Z"/><path d="M510 238 L525 250 L510 262Z"/><path d="M750 238 L765 250 L750 262Z"/></g><text x="500" y="390" font-size="22" fill="#17324d">Cycloplegic refraction helps identify the hyperopic component.</text><text x="500" y="430" font-size="20" fill="#526b7d">Full appropriate correction may reduce the accommodative component.</text></g></svg>