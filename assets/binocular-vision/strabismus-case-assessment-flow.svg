<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="t d"><title id="t">Strabismus clinical case assessment pathway</title><desc id="d">History and red flags, visual acuity and refraction, ocular health, motor and sensory assessment, classification and management/referral.</desc><rect width="900" height="520" rx="24" fill="#f6f9fc"/><text x="450" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#17324d">STRABISMUS CASE MANAGEMENT</text><g font-family="Arial" text-anchor="middle" stroke-width="3"><rect x="250" y="75" width="400" height="62" rx="14" fill="#ffe8e5" stroke="#b75b4e"/><text x="450" y="113" font-size="21" font-weight="bold" fill="#71352e">1. History + red-flag screen</text><path d="M450 137V160" stroke="#3976a8"/><path d="M440 150l10 10 10 -10" fill="none" stroke="#3976a8"/><rect x="250" y="165" width="400" height="62" rx="14" fill="#e3efff" stroke="#3976a8"/><text x="450" y="203" font-size="21" font-weight="bold" fill="#17324d">2. Acuity + refraction</text><path d="M450 227V250m-10 -10 10 10 10 -10" stroke="#3976a8" fill="none"/><rect x="250" y="255" width="400" height="62" rx="14" fill="#e7f5eb" stroke="#36835e"/><text x="450" y="293" font-size="21" font-weight="bold" fill="#17324d">3. Ocular health + motility</text><path d="M450 317V340m-10 -10 10 10 10 -10" stroke="#3976a8" fill="none"/><rect x="250" y="345" width="400" height="62" rx="14" fill="#f0eaff" stroke="#7756a8"/><text x="450" y="383" font-size="21" font-weight="bold" fill="#17324d">4. Sensory + motor classification</text><path d="M450 407V430m-10 -10 10 10 10 -10" stroke="#3976a8" fill="none"/><rect x="250" y="435" width="400" height="62" rx="14" fill="#fff0dc" stroke="#b47b2c"/><text x="450" y="473" font-size="21" font-weight="bold" fill="#17324d">5. Plan + follow-up / referral</text></g><text x="685" y="105" font-family="Arial" font-size="15" fill="#9b3d34">Urgent pathway</text><path d="M650 105H760V270H665" stroke="#b75b4e" stroke-width="3" stroke-dasharray="7 6" fill="none"/><text x="770" y="290" font-family="Arial" font-size="15" fill="#9b3d34" text-anchor="middle">Acute diplopia,</text><text x="770" y="310" font-family="Arial" font-size="15" fill="#9b3d34" text-anchor="middle">neurological signs,</text><text x="770" y="330" font-family="Arial" font-size="15" fill="#9b3d34" text-anchor="middle">pupil involvement</text></svg>